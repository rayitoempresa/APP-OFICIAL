<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#5C6169">
    <title>Acceso seguro</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #5C6169;
            --primary-dark: #454951;
            --primary-light: #8A8F97;
            --gold: #D4AF37;
            --bg-body: #EEF1F8;
            --bg-card: #FFFFFF;
            --bg-input: #F1F4FB;
            --border: #E3E8F4;
            --text-primary: #0B1120;
            --text-secondary: #5B6478;
            --text-muted: #98A1B5;
            --success: #16A34A;
            --danger: #E0473C;
            --shadow: 0 18px 35px -14px rgba(15,23,42,.14);
            --shadow-lg: 0 25px 45px -15px rgba(15,23,42,.22);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #EEF1F8 0%, #E3E8F4 50%, #D1D5E0 100%);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            margin: 0;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(92, 97, 105, 0.08) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: '';
            position: absolute;
            bottom: -30%;
            left: -30%;
            width: 80%;
            height: 80%;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.06) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .auth-container {
            width: 100%;
            max-width: 100%;
            position: relative;
            z-index: 10;
            height: 100vh;
            height: 100dvh;
            overflow-y: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(10px);
            box-shadow: none;
            border: none;
            display: flex;
            flex-direction: column;
        }

        .auth-container::-webkit-scrollbar {
            display: none;
        }

        .hero-image-section {
            position: relative;
            height: 45vh;
            min-height: 280px;
            max-height: 350px;
            overflow: hidden;
            background: url('https://bananomeridiano.com/wp-content/uploads/2024/10/la-paz-bolivia-plaza-mayor-san-francisco-1.jpg') center/cover no-repeat;
            background-size: cover;
            background-position: center;
            flex-shrink: 0;
            margin: 0;
            padding: 0;
            width: 100%;
        }

        .hero-image-section::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 50%;
            background: linear-gradient(to bottom, transparent 0%, rgba(255,255,255,0.3) 60%, rgba(255,255,255,0.95) 100%);
            pointer-events: none;
        }

        .hero-overlay {
            position: absolute;
            bottom: 15px;
            left: 20px;
            right: 20px;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            z-index: 2;
        }

        .logo-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(6px);
            padding: 8px 16px;
            border-radius: 40px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
        }

        .logo-mark-mini {
            display: flex;
            gap: 4px;
            align-items: center;
        }
        .logo-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--primary);
            display: inline-block;
        }
        .logo-dot.gold { background: var(--gold); }

        .brand-tagline-img {
            background: rgba(0,0,0,0.6);
            color: white;
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 500;
            backdrop-filter: blur(4px);
            letter-spacing: 0.3px;
        }

        .auth-card {
            background: var(--bg-card);
            border-radius: 28px 28px 0 0;
            padding: 25px 22px 30px;
            margin: -20px 0 0 0;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.15);
            position: relative;
            z-index: 5;
            animation: fadeInUp 0.5s ease;
            flex-shrink: 0;
        }

        .card-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 6px;
            letter-spacing: -0.3px;
        }

        .card-subtitle {
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 400;
        }

        .tabs-row {
            display: flex;
            gap: 18px;
            margin-bottom: 22px;
            border-bottom: 2px solid var(--border);
            padding-bottom: 5px;
        }

        .tab-button {
            background: none;
            border: none;
            padding: 8px 0;
            font-weight: 600;
            font-size: 15px;
            color: var(--text-muted);
            cursor: pointer;
            position: relative;
            transition: all 0.3s;
            letter-spacing: -0.2px;
        }

        .tab-button.active {
            color: var(--primary);
        }

        .tab-button.active::after {
            content: '';
            position: absolute;
            bottom: -7px;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--primary);
            border-radius: 3px;
        }

        .input-group {
            position: relative;
            margin-bottom: 16px;
        }

        .input-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 15px;
            pointer-events: none;
        }

        .input-field {
            width: 100%;
            padding: 14px 15px 14px 42px;
            border: 1.5px solid var(--border);
            border-radius: 14px;
            font-size: 14px;
            background: var(--bg-input);
            color: var(--text-primary);
            transition: all 0.25s ease;
            outline: none;
            font-weight: 500;
        }

        .input-field:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(92, 97, 105, 0.08);
            background: #FFFFFF;
        }

        .input-field::placeholder {
            color: var(--text-muted);
            font-weight: 400;
        }

        .password-toggle {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            cursor: pointer;
            background: none;
            border: none;
            font-size: 15px;
            padding: 5px;
        }

        .helper-text {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: -10px;
            margin-bottom: 16px;
            padding-left: 8px;
            letter-spacing: 0.2px;
        }

        /* Oculto pero funcional */
        .remember-row {
            display: none;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--text-secondary);
            cursor: pointer;
        }

        .forgot-link {
            font-size: 13px;
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
            background: none;
            border: none;
        }

        .btn-primary {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: #FFFFFF;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 50px;
            letter-spacing: 0.3px;
            box-shadow: 0 8px 18px rgba(69, 73, 81, 0.25);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(92, 97, 105, 0.35);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-primary:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #FFFFFF;
            animation: spin 0.8s linear infinite;
        }

        .error-message {
            background: #FEF2F2;
            border: 1px solid #FECACA;
            color: var(--danger);
            padding: 12px 15px;
            border-radius: 12px;
            font-size: 13px;
            margin-bottom: 18px;
            display: none;
            animation: shake 0.5s ease;
            font-weight: 500;
        }

        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 14px 22px;
            border-radius: 14px;
            color: #FFFFFF;
            font-weight: 500;
            z-index: 1000;
            animation: slideInRight 0.3s ease;
            box-shadow: 0 15px 25px -8px rgba(0,0,0,0.2);
            max-width: 340px;
            font-size: 14px;
            backdrop-filter: blur(5px);
            letter-spacing: 0.2px;
        }

        .toast.success { background: rgba(22, 163, 74, 0.95); }
        .toast.error { background: rgba(224, 71, 60, 0.95); }
        .toast.warning { background: rgba(217, 119, 6, 0.95); }
        .toast.info { background: rgba(37, 99, 235, 0.95); }

        .hidden {
            display: none !important;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(18px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(80px); }
            to { opacity: 1; transform: translateX(0); }
        }

        @media (max-width: 480px) {
            body { padding: 0; }
            .auth-container { height: 100vh; height: 100dvh; }
            .hero-image-section { height: 45vh; min-height: 250px; max-height: 320px; }
            .auth-card { border-radius: 24px 24px 0 0; }
            .card-title { font-size: 20px; }
        }

        @media (max-width: 380px) {
            .hero-image-section { height: 40vh; min-height: 200px; }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <!-- Imagen de La Paz, Bolivia, borde a borde -->
        <div class="hero-image-section"> </div>

        <!-- Contenido de autenticación -->
        <div class="auth-card">
            <div class="tabs-row">
                <button id="login-tab" class="tab-button active">Acceso</button>
                <button id="signup-tab" class="tab-button">Registro</button>
            </div>

            <div id="error-message" class="error-message">
                <i class="fas fa-exclamation-circle" style="margin-right: 6px;"></i>
                <span id="error-text"></span>
            </div>

            <!-- Login Form -->
            <form id="login-form">
                <div class="card-header">
                    <div class="card-title">Bienvenido de nuevo</div>
                    <div class="card-subtitle">Ingrese sus credenciales para continuar</div>
                </div>

                <div class="input-group">
                    <i class="fas fa-envelope input-icon"></i>
                    <input type="email" id="login-email" class="input-field" placeholder="Correo electrónico" required autocomplete="email">
                </div>

                <div class="input-group">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" id="login-password" class="input-field" placeholder="Contraseña" required autocomplete="current-password">
                    <button type="button" class="password-toggle" id="toggle-login-password">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>

                <!-- Funcionalidad oculta -->
                <div class="remember-row">
                    <label class="checkbox-label">
                        <input type="checkbox" id="remember-session">
                        Mantener sesión activa
                    </label>
                    <button type="button" class="forgot-link" onclick="showToast('Solicite asistencia a soporte para restablecer su contraseña', 'warning')">
                        ¿Olvidaste tu contraseña?
                    </button>
                </div>

                <button type="submit" class="btn-primary" id="login-button">
                    <span id="login-button-text">Iniciar sesión</span>
                    <div class="spinner" id="login-spinner" style="display: none;"></div>
                </button>
            </form>

            <!-- Signup Form -->
            <form id="signup-form" class="hidden">
                <div class="card-header">
                    <div class="card-title">Crear nueva cuenta</div>
                    <div class="card-subtitle">Complete sus datos para registrarse</div>
                </div>

                <div class="input-group">
                    <i class="fas fa-user input-icon"></i>
                    <input type="text" id="signup-name" class="input-field" placeholder="Nombre completo" required>
                </div>

                <div class="input-group">
                    <i class="fas fa-envelope input-icon"></i>
                    <input type="email" id="signup-email" class="input-field" placeholder="Correo electrónico" required autocomplete="email">
                </div>

                <div class="input-group">
                    <i class="fas fa-phone input-icon"></i>
                    <input type="tel" id="signup-phone" class="input-field" placeholder="Número de celular (8 dígitos)" pattern="[0-9]{8}" maxlength="8" required>
                </div>

                <div class="input-group">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" id="signup-password" class="input-field" placeholder="Crear contraseña" required>
                    <button type="button" class="password-toggle" id="toggle-signup-password">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
                <p class="helper-text">Mínimo 8 caracteres, combine letras y números</p>

                <button type="submit" class="btn-primary" id="signup-button">
                    <span id="signup-button-text">Registrarse</span>
                    <div class="spinner" id="signup-spinner" style="display: none;"></div>
                </button>
            </form>
        </div>
    </div>

    <script>
        (function() {
            const supabaseUrl = 'https://zdrefbeqbqpvkrbexcva.supabase.co';
            const supabaseKey = 'sb_publishable_fZgh-mQwxI-hnphiXRgHUA_ovOs_GF5';
            window.supabase = supabase.createClient(supabaseUrl, supabaseKey);

            function showToast(message, type = 'success') {
                const toast = document.createElement('div');
                toast.className = `toast ${type}`;
                const icons = {
                    success: 'fa-check-circle',
                    error: 'fa-exclamation-circle',
                    warning: 'fa-exclamation-triangle',
                    info: 'fa-info-circle'
                };
                toast.innerHTML = `<i class="fas ${icons[type] || icons.info}" style="margin-right: 8px;"></i> ${message}`;
                document.body.appendChild(toast);
                setTimeout(() => {
                    toast.style.opacity = '0';
                    toast.style.transition = 'opacity 0.4s';
                    setTimeout(() => toast.remove(), 400);
                }, 3200);
            }

            function showError(message) {
                const errorElement = document.getElementById('error-message');
                const errorText = document.getElementById('error-text');
                errorText.textContent = message;
                errorElement.style.display = 'flex';
                errorElement.style.alignItems = 'center';
                setTimeout(() => {
                    errorElement.style.display = 'none';
                }, 5000);
            }

            function setButtonLoading(buttonId, textId, spinnerId, isLoading, loadingText) {
                const button = document.getElementById(buttonId);
                const text = document.getElementById(textId);
                const spinner = document.getElementById(spinnerId);
                
                if (isLoading) {
                    button.disabled = true;
                    text.textContent = loadingText;
                    spinner.style.display = 'block';
                } else {
                    button.disabled = false;
                    text.textContent = textId.includes('login') ? 'Iniciar sesión' : 'Registrarse';
                    spinner.style.display = 'none';
                }
            }

            async function checkNameExists(name) {
                try {
                    const { data, error } = await window.supabase
                        .from('user_profiles')
                        .select('full_name')
                        .eq('full_name', name)
                        .maybeSingle();
                    if (error) throw error;
                    return !!data;
                } catch (e) { console.error('Error verificando nombre:', e); return false; }
            }
            async function checkEmailExists(email) {
                try {
                    const { data, error } = await window.supabase
                        .from('user_profiles')
                        .select('email')
                        .eq('email', email)
                        .maybeSingle();
                    if (error) throw error;
                    return !!data;
                } catch (e) { console.error('Error verificando email:', e); return false; }
            }
            async function checkPhoneExists(phone) {
                try {
                    const { data, error } = await window.supabase
                        .from('user_profiles')
                        .select('phone')
                        .eq('phone', phone)
                        .maybeSingle();
                    if (error) throw error;
                    return !!data;
                } catch (e) { console.error('Error verificando teléfono:', e); return false; }
            }

            async function checkSession() {
                try {
                    const { data: { session }, error } = await window.supabase.auth.getSession();
                    if (error) return false;
                    if (session) {
                        showToast('Sesión activa detectada', 'info');
                        setTimeout(() => window.location.href = 'dashboard.html', 1200);
                        return true;
                    }
                    return false;
                } catch (e) { return false; }
            }

            const loginTab = document.getElementById('login-tab');
            const signupTab = document.getElementById('signup-tab');
            const loginForm = document.getElementById('login-form');
            const signupForm = document.getElementById('signup-form');

            function resetTabStyles() {
                [loginTab, signupTab].forEach(t => t.classList.remove('active'));
            }

            loginTab.addEventListener('click', () => {
                resetTabStyles();
                loginTab.classList.add('active');
                loginForm.classList.remove('hidden');
                signupForm.classList.add('hidden');
                document.getElementById('error-message').style.display = 'none';
            });
            signupTab.addEventListener('click', () => {
                resetTabStyles();
                signupTab.classList.add('active');
                signupForm.classList.remove('hidden');
                loginForm.classList.add('hidden');
                document.getElementById('error-message').style.display = 'none';
            });

            function togglePassword(inputId, btnId) {
                const pwd = document.getElementById(inputId);
                const icon = document.querySelector(`#${btnId} i`);
                if (pwd.type === 'password') {
                    pwd.type = 'text';
                    icon.classList.replace('fa-eye', 'fa-eye-slash');
                } else {
                    pwd.type = 'password';
                    icon.classList.replace('fa-eye-slash', 'fa-eye');
                }
            }
            document.getElementById('toggle-login-password').addEventListener('click', () => togglePassword('login-password','toggle-login-password'));
            document.getElementById('toggle-signup-password').addEventListener('click', () => togglePassword('signup-password','toggle-signup-password'));

            document.getElementById('login-form').addEventListener('submit', async function(e) {
                e.preventDefault();
                const email = document.getElementById('login-email').value.trim();
                const password = document.getElementById('login-password').value;
                const rememberSession = document.getElementById('remember-session').checked;

                setButtonLoading('login-button', 'login-button-text', 'login-spinner', true, 'Autenticando...');
                try {
                    const { data, error } = await window.supabase.auth.signInWithPassword({ email, password });
                    if (error) throw error;

                    if (rememberSession) {
                        localStorage.setItem('rayito_remember_session', 'true');
                        localStorage.setItem('rayito_remembered_email', email);
                    } else {
                        localStorage.setItem('rayito_remember_session', 'false');
                        localStorage.removeItem('rayito_remembered_email');
                    }

                    showToast('Acceso autorizado. Redirigiendo...', 'success');
                    setTimeout(() => window.location.href = 'dashboard.html', 1000);
                } catch (error) {
                    console.error('Login:', error);
                    let msg = 'No se pudo iniciar sesión. Verifique sus credenciales.';
                    if (error.message.includes('Invalid login credentials')) msg = 'Correo o contraseña incorrectos.';
                    else if (error.message.includes('Email not confirmed')) msg = 'Confirme su correo electrónico antes de ingresar.';
                    showError(msg);
                    setButtonLoading('login-button', 'login-button-text', 'login-spinner', false);
                }
            });

            document.getElementById('signup-form').addEventListener('submit', async function(e) {
                e.preventDefault();
                const name = document.getElementById('signup-name').value.trim();
                const email = document.getElementById('signup-email').value.trim();
                const phone = document.getElementById('signup-phone').value.trim();
                const password = document.getElementById('signup-password').value;

                if (password.length < 8) {
                    showError('La contraseña debe tener al menos 8 caracteres.');
                    return;
                }
                if (!/[a-zA-Z]/.test(password) || !/[0-9]/.test(password)) {
                    showError('La contraseña debe incluir letras y números.');
                    return;
                }

                setButtonLoading('signup-button', 'signup-button-text', 'signup-spinner', true, 'Validando información...');
                try {
                    const nameExists = await checkNameExists(name);
                    if (nameExists) {
                        showError('El nombre ya está registrado. Por favor elija otro.');
                        setButtonLoading('signup-button', 'signup-button-text', 'signup-spinner', false);
                        return;
                    }
                    const emailExists = await checkEmailExists(email);
                    if (emailExists) {
                        showError('El correo electrónico ya se encuentra vinculado a una cuenta.');
                        setButtonLoading('signup-button', 'signup-button-text', 'signup-spinner', false);
                        return;
                    }
                    const phoneExists = await checkPhoneExists(phone);
                    if (phoneExists) {
                        showError('El número de teléfono ya está asociado a otro usuario.');
                        setButtonLoading('signup-button', 'signup-button-text', 'signup-spinner', false);
                        return;
                    }

                    setButtonLoading('signup-button', 'signup-button-text', 'signup-spinner', true, 'Creando cuenta...');
                    const { data: authData, error: authError } = await window.supabase.auth.signUp({
                        email,
                        password,
                        options: { data: { phone, full_name: name } }
                    });
                    if (authError) throw authError;
                    const userId = authData.user?.id;
                    if (!userId) throw new Error('No se pudo obtener el identificador de usuario.');

                    const { error: dbError } = await window.supabase
                        .from('user_profiles')
                        .insert([{ id: userId, full_name: name, email, phone, avatar_url: null }]);
                    if (dbError) throw dbError;

                    showToast('Registro exitoso. Ahora puede iniciar sesión.', 'success');
                    setTimeout(() => {
                        signupTab.click();
                        document.getElementById('login-email').value = email;
                        document.getElementById('login-password').value = '';
                        showToast('Complete sus credenciales para ingresar', 'info');
                    }, 1800);
                } catch (error) {
                    console.error('Registro:', error);
                    showError('Error al crear la cuenta. Intente nuevamente.');
                    setButtonLoading('signup-button', 'signup-button-text', 'signup-spinner', false);
                } finally {
                    setButtonLoading('signup-button', 'signup-button-text', 'signup-spinner', false);
                }
            });

            document.addEventListener('DOMContentLoaded', async function() {
                const hasSession = await checkSession();
                if (hasSession) return;
                const rememberedEmail = localStorage.getItem('rayito_remembered_email');
                if (rememberedEmail && localStorage.getItem('rayito_remember_session') === 'true') {
                    document.getElementById('login-email').value = rememberedEmail;
                    document.getElementById('remember-session').checked = true;
                }
            });
        })();
    </script>
</body>
</html>
