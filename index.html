<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#5C6169">
    <title>Rayito - Billetera Digital</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #5C6169;
            --primary-dark: #454951;
            --primary-light: #8A8F97;
            --gold: #D4AF37;
            --bg-body: #EEF1F8;
            --bg-card: #FFFFFF;
            --bg-input: #F1F4FB;
            --border: #E3E8F4;
            --text-primary: #0B1120;
            --text-secondary: #5B6478;
            --text-muted: #98A1B5;
            --success: #16A34A;
            --danger: #E0473C;
            --shadow: 0 18px 35px -14px rgba(15,23,42,.14);
            --shadow-lg: 0 25px 45px -15px rgba(15,23,42,.22);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #EEF1F8 0%, #E3E8F4 50%, #D1D5E0 100%);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(92, 97, 105, 0.08) 0%, transparent 70%);
            pointer-events: none;
        }

        body::after {
            content: '';
            position: absolute;
            bottom: -30%;
            left: -30%;
            width: 80%;
            height: 80%;
            background: radial-gradient(circle, rgba(212, 175, 55, 0.06) 0%, transparent 70%);
            pointer-events: none;
        }

        .auth-container {
            width: 100%;
            max-width: 420px;
            position: relative;
            z-index: 10;
            max-height: 90vh;
            overflow-y: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .auth-container::-webkit-scrollbar {
            display: none;
        }

        .logo-section {
            text-align: center;
            margin-bottom: 30px;
            animation: fadeInDown 0.6s ease;
        }

        .logo-mark {
            position: relative;
            width: 80px;
            height: 80px;
            margin: 0 auto 15px;
        }

        .logo-circle {
            position: absolute;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .logo-circle.c1 {
            background: var(--primary);
            animation: pulse 3s ease-in-out infinite;
        }

        .logo-circle.c2 {
            background: var(--gold);
            opacity: 0.85;
            margin-left: 12px;
            margin-top: 12px;
        }

        .brand-name {
            font-size: 32px;
            font-weight: 800;
            color: var(--primary);
            letter-spacing: -0.5px;
        }

        .brand-tagline {
            font-size: 14px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .card {
            background: var(--bg-card);
            border-radius: 24px;
            padding: 30px 25px;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border);
            animation: fadeInUp 0.6s ease;
        }

        .card-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .card-title {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .card-subtitle {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .tabs-row {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
            border-bottom: 2px solid var(--border);
        }

        .tab-button {
            background: none;
            border: none;
            padding: 10px 0;
            font-weight: 600;
            font-size: 14px;
            color: var(--text-muted);
            cursor: pointer;
            position: relative;
            transition: all 0.3s;
        }

        .tab-button.active {
            color: var(--primary);
        }

        .tab-button.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 2px;
            background: var(--primary);
            border-radius: 2px;
        }

        .input-group {
            position: relative;
            margin-bottom: 18px;
        }

        .input-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 16px;
            pointer-events: none;
        }

        .input-field {
            width: 100%;
            padding: 14px 15px 14px 42px;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            font-size: 14px;
            background: var(--bg-input);
            color: var(--text-primary);
            transition: all 0.3s ease;
            outline: none;
        }

        .input-field:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(92, 97, 105, 0.1);
            background: #FFFFFF;
        }

        .input-field::placeholder {
            color: var(--text-muted);
        }

        .input-field:disabled {
            background: #e2e8f0;
            color: #64748b;
            cursor: not-allowed;
        }

        .password-toggle {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            cursor: pointer;
            background: none;
            border: none;
            font-size: 16px;
            padding: 5px;
        }

        .password-toggle:hover {
            color: var(--primary);
        }

        .helper-text {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: -12px;
            margin-bottom: 18px;
            padding-left: 5px;
        }

        .remember-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--text-secondary);
            cursor: pointer;
        }

        .checkbox-label input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .forgot-link {
            font-size: 13px;
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
            background: none;
            border: none;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        .btn-primary {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: #FFFFFF;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 50px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(92, 97, 105, 0.3);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #FFFFFF;
            animation: spin 0.8s linear infinite;
        }

        .error-message {
            background: #FEF2F2;
            border: 1px solid #FECACA;
            color: var(--danger);
            padding: 12px 15px;
            border-radius: 12px;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
            animation: shake 0.5s ease;
        }

        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 20px;
            border-radius: 12px;
            color: #FFFFFF;
            font-weight: 500;
            z-index: 1000;
            animation: slideInRight 0.3s ease;
            box-shadow: var(--shadow);
            max-width: 350px;
            font-size: 14px;
        }

        .toast.success {
            background: var(--success);
        }

        .toast.error {
            background: var(--danger);
        }

        .toast.warning {
            background: #D97706;
        }

        .toast.info {
            background: #2563EB;
        }

        .hidden {
            display: none !important;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.1); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(100px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @media (max-width: 480px) {
            .card {
                padding: 25px 20px;
                border-radius: 20px;
            }
            .brand-name {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <!-- Logo Section -->
        <div class="logo-section">
            <div class="logo-mark">
                <div class="logo-circle c1"></div>
                <div class="logo-circle c2"></div>
            </div>
            <div class="brand-name">Rayito</div>
            <div class="brand-tagline">Tu billetera digital de confianza</div>
        </div>

        <!-- Auth Card -->
        <div class="card">
            <!-- Tabs -->
            <div class="tabs-row">
                <button id="login-tab" class="tab-button active">Iniciar Sesión</button>
                <button id="signup-tab" class="tab-button">Registrarse</button>
            </div>

            <div id="error-message" class="error-message">
                <i class="fas fa-exclamation-circle"></i>
                <span id="error-text"></span>
            </div>

            <!-- Login Form -->
            <form id="login-form">
                <div class="card-header" style="margin-bottom: 20px;">
                    <div class="card-title">Bienvenido</div>
                    <div class="card-subtitle">Ingresa tus credenciales</div>
                </div>

                <div class="input-group">
                    <i class="fas fa-envelope input-icon"></i>
                    <input type="email" id="login-email" class="input-field" placeholder="Correo electrónico" required autocomplete="email">
                </div>

                <div class="input-group">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" id="login-password" class="input-field" placeholder="Contraseña" required autocomplete="current-password">
                    <button type="button" class="password-toggle" id="toggle-login-password">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>

                <div class="remember-row">
                    <label class="checkbox-label">
                        <input type="checkbox" id="remember-session">
                        Mantener sesión
                    </label>
                    <button type="button" class="forgot-link" onclick="showToast('Contacta soporte para recuperar tu contraseña', 'warning')">
                        ¿Olvidaste tu contraseña?
                    </button>
                </div>

                <button type="submit" class="btn-primary" id="login-button">
                    <span id="login-button-text">Iniciar sesión</span>
                    <div class="spinner" id="login-spinner" style="display: none;"></div>
                </button>
            </form>

            <!-- Signup Form -->
            <form id="signup-form" class="hidden">
                <div class="card-header" style="margin-bottom: 20px;">
                    <div class="card-title">Crear cuenta</div>
                    <div class="card-subtitle">Regístrate para comenzar</div>
                </div>

                <div class="input-group">
                    <i class="fas fa-user input-icon"></i>
                    <input type="text" id="signup-name" class="input-field" placeholder="Nombre completo" required>
                </div>

                <div class="input-group">
                    <i class="fas fa-envelope input-icon"></i>
                    <input type="email" id="signup-email" class="input-field" placeholder="Correo electrónico" required autocomplete="email">
                </div>

                <div class="input-group">
                    <i class="fas fa-phone input-icon"></i>
                    <input type="tel" id="signup-phone" class="input-field" placeholder="Número de celular (8 dígitos)" pattern="[0-9]{8}" maxlength="8" required>
                </div>

                <div class="input-group">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" id="signup-password" class="input-field" placeholder="Crear contraseña" required>
                    <button type="button" class="password-toggle" id="toggle-signup-password">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
                <p class="helper-text">Mínimo 8 caracteres con números y letras</p>

                <button type="submit" class="btn-primary" id="signup-button">
                    <span id="signup-button-text">Crear cuenta</span>
                    <div class="spinner" id="signup-spinner" style="display: none;"></div>
                </button>
            </form>
        </div>
    </div>

    <script>
        // Configuración de Supabase
        const supabaseUrl = 'https://zdrefbeqbqpvkrbexcva.supabase.co';
        const supabaseKey = 'sb_publishable_fZgh-mQwxI-hnphiXRgHUA_ovOs_GF5';
        window.supabase = supabase.createClient(supabaseUrl, supabaseKey);

        // Funciones de utilidad
        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            const icons = {
                success: 'fa-check-circle',
                error: 'fa-exclamation-circle',
                warning: 'fa-exclamation-triangle',
                info: 'fa-info-circle'
            };
            toast.innerHTML = `<i class="fas ${icons[type] || icons.info}"></i> ${message}`;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function showError(message) {
            const errorElement = document.getElementById('error-message');
            const errorText = document.getElementById('error-text');
            errorText.textContent = message;
            errorElement.style.display = 'block';
            setTimeout(() => {
                errorElement.style.display = 'none';
            }, 5000);
        }

        function setButtonLoading(buttonId, textId, spinnerId, isLoading, loadingText) {
            const button = document.getElementById(buttonId);
            const text = document.getElementById(textId);
            const spinner = document.getElementById(spinnerId);
            
            if (isLoading) {
                button.disabled = true;
                text.textContent = loadingText;
                spinner.style.display = 'block';
            } else {
                button.disabled = false;
                text.textContent = textId.includes('login') ? 'Iniciar sesión' : 'Crear cuenta';
                spinner.style.display = 'none';
            }
        }

        // Funciones de validación
        async function checkNameExists(name) {
            try {
                const { data, error } = await window.supabase
                    .from('user_profiles')
                    .select('full_name')
                    .eq('full_name', name)
                    .maybeSingle();

                if (error) throw error;
                return !!data;
            } catch (error) {
                console.error('Error verificando nombre:', error);
                return false;
            }
        }

        async function checkEmailExists(email) {
            try {
                const { data, error } = await window.supabase
                    .from('user_profiles')
                    .select('email')
                    .eq('email', email)
                    .maybeSingle();

                if (error) throw error;
                return !!data;
            } catch (error) {
                console.error('Error verificando email:', error);
                return false;
            }
        }

        async function checkPhoneExists(phone) {
            try {
                const { data, error } = await window.supabase
                    .from('user_profiles')
                    .select('phone')
                    .eq('phone', phone)
                    .maybeSingle();

                if (error) throw error;
                return !!data;
            } catch (error) {
                console.error('Error verificando teléfono:', error);
                return false;
            }
        }

        // Verificar sesión existente
        async function checkSession() {
            try {
                const { data: { session }, error } = await window.supabase.auth.getSession();
                if (error) {
                    console.error('Error al verificar sesión:', error);
                    return false;
                }

                if (session) {
                    console.log('Sesión activa encontrada, redirigiendo...');
                    showToast('Sesión activa', 'info');
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1000);
                    return true;
                }
                return false;
            } catch (error) {
                console.error('Error inesperado al verificar sesión:', error);
                return false;
            }
        }

        // Cambiar entre tabs
        const loginTab = document.getElementById('login-tab');
        const signupTab = document.getElementById('signup-tab');
        const loginForm = document.getElementById('login-form');
        const signupForm = document.getElementById('signup-form');

        loginTab.addEventListener('click', () => {
            loginTab.classList.add('active');
            signupTab.classList.remove('active');
            loginForm.classList.remove('hidden');
            signupForm.classList.add('hidden');
            document.getElementById('error-message').style.display = 'none';
        });

        signupTab.addEventListener('click', () => {
            signupTab.classList.add('active');
            loginTab.classList.remove('active');
            signupForm.classList.remove('hidden');
            loginForm.classList.add('hidden');
            document.getElementById('error-message').style.display = 'none';
        });

        // Toggle password visibility
        document.getElementById('toggle-login-password').addEventListener('click', function() {
            const passwordInput = document.getElementById('login-password');
            const icon = this.querySelector('i');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        });

        document.getElementById('toggle-signup-password').addEventListener('click', function() {
            const passwordInput = document.getElementById('signup-password');
            const icon = this.querySelector('i');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        });

        // Handle login form submission
        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();

            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;
            const rememberSession = document.getElementById('remember-session').checked;

            setButtonLoading('login-button', 'login-button-text', 'login-spinner', true, 'Iniciando...');

            try {
                const { data, error } = await window.supabase.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) throw error;

                // Guardar preferencia de sesión
                if (rememberSession) {
                    localStorage.setItem('rayito_remember_session', 'true');
                    localStorage.setItem('rayito_remembered_email', email);
                } else {
                    localStorage.setItem('rayito_remember_session', 'false');
                    localStorage.removeItem('rayito_remembered_email');
                }

                showToast('¡Bienvenido de vuelta!', 'success');
                
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1000);

            } catch (error) {
                console.error('Login error:', error);
                showError(error.message || 'Error al iniciar sesión');
                setButtonLoading('login-button', 'login-button-text', 'login-spinner', false);
            }
        });

        // Handle signup form submission
        document.getElementById('signup-form').addEventListener('submit', async function(e) {
            e.preventDefault();

            const name = document.getElementById('signup-name').value.trim();
            const email = document.getElementById('signup-email').value.trim();
            const phone = document.getElementById('signup-phone').value.trim();
            const password = document.getElementById('signup-password').value;

            // Validar contraseña
            if (password.length < 8) {
                showError('La contraseña debe tener al menos 8 caracteres');
                return;
            }

            if (!/[a-zA-Z]/.test(password) || !/[0-9]/.test(password)) {
                showError('La contraseña debe contener letras y números');
                return;
            }

            setButtonLoading('signup-button', 'signup-button-text', 'signup-spinner', true, 'Verificando...');

            try {
                // 1. Verificar si el nombre ya existe
                const nameExists = await checkNameExists(name);
                if (nameExists) {
                    showError('El nombre ya está registrado. Por favor, usa otro nombre.');
                    setButtonLoading('signup-button', 'signup-button-text', 'signup-spinner', false);
                    return;
                }

                // 2. Verificar si el email ya existe
                const emailExists = await checkEmailExists(email);
                if (emailExists) {
                    showError('El correo electrónico ya está registrado. Por favor, usa otro correo.');
                    setButtonLoading('signup-button', 'signup-button-text', 'signup-spinner', false);
                    return;
                }

                // 3. Verificar si el teléfono ya existe
                const phoneExists = await checkPhoneExists(phone);
                if (phoneExists) {
                    showError('El número de teléfono ya está registrado. Por favor, usa otro número.');
                    setButtonLoading('signup-button', 'signup-button-text', 'signup-spinner', false);
                    return;
                }

                // Si todas las validaciones pasan, proceder con el registro
                setButtonLoading('signup-button', 'signup-button-text', 'signup-spinner', true, 'Creando cuenta...');

                const { data: authData, error: authError } = await window.supabase.auth.signUp({
                    email: email,
                    password: password,
                    options: {
                        data: {
                            phone: phone,
                            full_name: name
                        }
                    }
                });

                if (authError) throw authError;

                const userId = authData.user?.id;

                if (!userId) {
                    throw new Error('No se pudo obtener el ID del usuario');
                }

                // Guardar datos en user_profiles
                const { error: dbError } = await window.supabase
                    .from('user_profiles')
                    .insert([
                        {
                            id: userId,
                            full_name: name,
                            email: email,
                            phone: phone,
                            avatar_url: null
                        }
                    ]);

                if (dbError) {
                    console.error('Error insertando en user_profiles:', dbError);
                    throw dbError;
                }

                showToast('¡Cuenta creada exitosamente!', 'success');

                setTimeout(() => {
                    // Cambiar a login
                    loginTab.click();
                    document.getElementById('login-email').value = email;
                    document.getElementById('login-password').value = '';
                    showToast('Ahora puedes iniciar sesión', 'info');
                }, 2000);

            } catch (error) {
                console.error('Error en registro:', error);
                showError(error.message || 'Error al crear la cuenta');
                setButtonLoading('signup-button', 'signup-button-text', 'signup-spinner', false);
            } finally {
                setButtonLoading('signup-button', 'signup-button-text', 'signup-spinner', false);
            }
        });

        // Autofill email si está recordado
        document.addEventListener('DOMContentLoaded', async function() {
            const hasSession = await checkSession();
            if (hasSession) return;

            const rememberedEmail = localStorage.getItem('rayito_remembered_email');
            if (rememberedEmail && localStorage.getItem('rayito_remember_session') === 'true') {
                document.getElementById('login-email').value = rememberedEmail;
                document.getElementById('remember-session').checked = true;
            }
        });
    </script>
</body>
</html>
