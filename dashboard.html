<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta id="theme-color" name="theme-color" content="#FFFFFF">
<title>Mi Billetera · Rayito</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --primary:#17212A;
  --primary-light:#2A2A2A;
  --bg-body:#FAFAFA;
  --bg-card:#FFFFFF;
  --bg-input:#F8F8F8;
  --border:#E5E5E5;
  --border-dark:#CCCCCC;
  --text-primary:#000000;
  --text-secondary:#444444;
  --text-muted:#888888;
  --danger:#E53935;
  --success:#43A047;
  --shadow-sm:0 2px 4px rgba(0,0,0,.06);
  --shadow-md:0 4px 12px rgba(0,0,0,.08);
  --shadow-lg:0 8px 24px rgba(0,0,0,.12);
  --card-bg:linear-gradient(90deg, #17212A 0%, #1C2731 28%, #303C48 55%, #414D59 78%, #2D3945 100%);
  --card-text:#FFFFFF;
  --radius:12px;
  --radius-sm:8px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;
  font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
  scrollbar-width:none!important;-ms-overflow-style:none!important;}
*::-webkit-scrollbar{display:none!important;width:0!important;height:0!important;}
html{scroll-behavior:smooth;}
body{background:var(--bg-body);color:var(--text-primary);min-height:100vh;
  display:flex;justify-content:center;align-items:flex-start;padding:0;padding-bottom:0;
  position:relative;overflow:hidden;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;}
.wallet-container{width:100%;max-width:420px;display:flex;flex-direction:column;gap:14px;
  position:relative;overflow-y:auto;overflow-x:hidden;height:100vh;max-height:100vh;
  padding:16px;padding-bottom:90px;
  will-change:transform;
  transform:translateZ(0);
  backface-visibility:hidden;}

/* ---------- HEADER ---------- */
.header{display:flex;justify-content:space-between;align-items:center;flex-shrink:0;padding:4px;
  animation:fadeInDown .6s cubic-bezier(.16,1,.3,1);}
.header-left{display:flex;align-items:center;gap:10px;}
.avatar-wrap{position:relative;width:40px;height:40px;flex-shrink:0;cursor:pointer;
  transition:transform .3s cubic-bezier(.34,1.56,.64,1);}
.avatar-wrap:hover{transform:scale(1.1) rotate(5deg);}
.avatar-wrap:active{transform:scale(.95);}
.profile-img{width:40px;height:40px;border-radius:50%;background:var(--primary);
  background-image:url('https://picsum.photos/id/64/100/100');background-size:cover;background-position:center;
  border:2px solid var(--primary);box-shadow:0 2px 8px rgba(0,0,0,.15);
  transition:box-shadow .3s cubic-bezier(.4,0,.2,1);}
.avatar-cam-dot{position:absolute;bottom:-2px;right:-2px;width:14px;height:14px;border-radius:50%;
  background:var(--primary);border:2px solid #fff;display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 4px rgba(0,0,0,.2);
  transition:transform .3s cubic-bezier(.34,1.56,.64,1);}
.avatar-wrap:hover .avatar-cam-dot{transform:scale(1.2);}
.avatar-cam-dot svg{width:7px;height:7px;stroke:#fff;fill:none;stroke-width:2.5;}
.greeting-name{font-size:13px;font-weight:700;color:var(--text-primary);letter-spacing:-0.2px;}

/* ---------- CARD ---------- */
.debit-card{
  position:relative;border-radius:16px;padding:20px;overflow:hidden;flex-shrink:0;
  background:var(--card-bg);
  color:var(--card-text);
  min-height:120px;display:flex;flex-direction:column;justify-content:center;
  box-shadow:0 10px 30px rgba(0,0,0,.25);
  border:1px solid rgba(255,255,255,.2);
  animation:scaleIn .8s cubic-bezier(.16,1,.3,1);
  transition:all .5s cubic-bezier(.4,0,.2,1);
  will-change:transform;
  transform:translateZ(0);
  backface-visibility:hidden;}
.debit-card:hover{transform:translateY(-3px) scale(1.02);
  box-shadow:0 15px 40px rgba(0,0,0,.3);}
.debit-card::before{
  content:'';
  position:absolute;
  top:-50%;
  right:-30%;
  width:200px;
  height:200px;
  background:radial-gradient(circle, rgba(255,255,255,.1) 0%, transparent 70%);
  border-radius:50%;
  animation:shimmer 3s ease-in-out infinite;}
@keyframes shimmer{
  0%,100%{transform:translate(0,0);opacity:.5;}
  50%{transform:translate(-20px,20px);opacity:1;}
}
.card-row-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;position:relative;z-index:1;}
.card-issuer{font-size:11px;letter-spacing:2px;font-weight:700;text-align:right;
  text-shadow:0 2px 4px rgba(0,0,0,.3);}
.card-row-mid{text-align:left;position:relative;z-index:1;}
.balance-label-row{display:flex;align-items:center;gap:8px;margin-bottom:4px;}
.balance-label{font-size:11px;color:rgba(255,255,255,.9);font-weight:500;
  text-shadow:0 1px 2px rgba(0,0,0,.3);}
.eye-toggle{cursor:pointer;display:flex;color:rgba(255,255,255,.9);
  transition:all .3s cubic-bezier(.34,1.56,.64,1);}
.eye-toggle:hover{transform:scale(1.2) rotate(10deg);}
.eye-toggle:active{transform:scale(.9);}
.eye-toggle svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;}
.balance-amount{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;
  text-shadow:0 2px 8px rgba(0,0,0,.5);letter-spacing:-0.5px;
  animation:pulse 2s ease-in-out infinite;}
@keyframes pulse{
  0%,100%{text-shadow:0 2px 8px rgba(0,0,0,.5);}
  50%{text-shadow:0 2px 16px rgba(255,255,255,.7);}
}

/* ---------- BUTTONS ---------- */
.module-window{background:var(--bg-card);
  border-radius:var(--radius);padding:14px;box-shadow:var(--shadow-md);border:1px solid var(--border);flex-shrink:0;
  transition:all .4s cubic-bezier(.4,0,.2,1);
  animation:fadeInUp .8s cubic-bezier(.16,1,.3,1);
  will-change:transform;
  transform:translateZ(0);
  backface-visibility:hidden;}
.module-window:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px);}
.buttons-row{display:flex;gap:10px;}
.btn{flex:1;padding:14px;border-radius:var(--radius-sm);border:none;font-size:12px;font-weight:700;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:8px;
  transition:all .3s cubic-bezier(.34,1.56,.64,1);position:relative;overflow:hidden;
  will-change:transform;
  transform:translateZ(0);
  backface-visibility:hidden;}
.btn::before{
  content:'';
  position:absolute;
  top:50%;
  left:50%;
  width:0;
  height:0;
  background:rgba(255,255,255,.3);
  border-radius:50%;
  transform:translate(-50%,-50%);
  transition:width .6s ease,height .6s ease;}
.btn:active::before{
  width:200px;
  height:200px;
  opacity:0;}
.btn:active{transform:scale(.95);}
.btn-recharge{
  background:linear-gradient(
    90deg,
    rgba(10, 20, 28, 0.95),
    rgba(45, 59, 72, 0.88),
    rgba(65, 77, 89, 0.80)
  );
  color:#fff;
  box-shadow:0 4px 12px rgba(0,0,0,.25);
  position:relative;
  overflow:hidden;}
.btn-recharge:hover{box-shadow:0 8px 20px rgba(0,0,0,.3);transform:translateY(-2px);}
.btn-recharge:active{box-shadow:0 2px 6px rgba(0,0,0,.2);}
.btn-pay{
  background:linear-gradient(
    90deg,
    rgba(10, 20, 28, 0.95),
    rgba(45, 59, 72, 0.88),
    rgba(65, 77, 89, 0.80)
  );
  color:#fff;
  box-shadow:0 2px 8px rgba(0,0,0,.1);
  position:relative;
  overflow:hidden;}
.btn-pay:hover{box-shadow:0 6px 16px rgba(0,0,0,.15);transform:translateY(-2px);}
.btn-pay:active{box-shadow:0 1px 4px rgba(0,0,0,.08);}

.section-title{font-size:13px;font-weight:700;color:var(--text-primary);margin-bottom:10px;
  display:flex;align-items:center;gap:8px;letter-spacing:-0.2px;}
.section-title::after{content:'';flex:1;height:1px;background:linear-gradient(to right, var(--border-dark), transparent);
  transition:background .3s ease;}
.link-small{font-size:10px;font-weight:700;color:var(--text-primary);cursor:pointer;
  text-decoration:underline;transition:all .3s cubic-bezier(.4,0,.2,1);position:relative;}
.link-small:hover{opacity:.7;transform:translateX(3px);}
.link-small:active{transform:scale(.95);}

.quick-actions-row{display:flex;gap:8px;margin-bottom:12px;}
.quick-action-btn{flex:1;background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;
  color:var(--text-primary);font-weight:700;font-size:10px;
  transition:all .3s cubic-bezier(.34,1.56,.64,1);box-shadow:var(--shadow-sm);
  will-change:transform;
  transform:translateZ(0);
  backface-visibility:hidden;}
.quick-action-btn:hover{box-shadow:var(--shadow-md);transform:translateY(-3px) scale(1.05);}
.quick-action-btn:active{transform:translateY(0) scale(.95);box-shadow:var(--shadow-sm);}
.qa-icon{width:28px;height:28px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;
  background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.1);
  transition:all .3s cubic-bezier(.34,1.56,.64,1);
  overflow:hidden;}
.quick-action-btn:hover .qa-icon{transform:rotate(15deg) scale(1.1);}
.qa-icon img{width:100%;height:100%;object-fit:cover;border-radius:var(--radius-sm);}
.qa-icon svg{width:15px;height:15px;stroke-width:2;}

/* ---------- TRANSACTIONS ---------- */
.tx-group-label{font-size:10px;font-weight:700;color:var(--text-muted);letter-spacing:.3px;
  padding:10px 2px 6px;text-transform:uppercase;
  animation:fadeIn .5s cubic-bezier(.16,1,.3,1);}
.transaction-item{background:var(--bg-input);border-radius:var(--radius-sm);padding:12px;border:1px solid var(--border);
  display:flex;align-items:center;gap:12px;cursor:pointer;margin-bottom:6px;
  transition:all .3s cubic-bezier(.4,0,.2,1);box-shadow:var(--shadow-sm);
  will-change:transform;
  transform:translateZ(0);
  backface-visibility:hidden;
  animation:slideIn .5s cubic-bezier(.16,1,.3,1) both;}
.transaction-item:nth-child(1){animation-delay:.05s;}
.transaction-item:nth-child(2){animation-delay:.1s;}
.transaction-item:nth-child(3){animation-delay:.15s;}
.transaction-item:nth-child(4){animation-delay:.2s;}
.transaction-item:nth-child(5){animation-delay:.25s;}
.transaction-item:hover{box-shadow:var(--shadow-md);transform:translateX(5px) scale(1.02);}
.transaction-item:active{transform:translateX(0) scale(.98);box-shadow:var(--shadow-sm);}
.transaction-item:last-child{margin-bottom:0;}
.transaction-icon{width:34px;height:34px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;flex-shrink:0;
  box-shadow:0 2px 6px rgba(0,0,0,.08);
  transition:all .3s cubic-bezier(.34,1.56,.64,1);}
.transaction-item:hover .transaction-icon{transform:scale(1.1) rotate(5deg);}
.transaction-icon svg{width:15px;height:15px;fill:none;stroke-width:2;}
.transaction-details{flex:1;min-width:0;}
.transaction-title{font-size:12px;font-weight:700;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.transaction-sub{font-size:10px;color:var(--text-muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.transaction-right{text-align:right;flex-shrink:0;}
.transaction-amount{font-size:12px;font-weight:700;white-space:nowrap;letter-spacing:-0.3px;
  transition:transform .3s cubic-bezier(.34,1.56,.64,1);}
.transaction-item:hover .transaction-amount{transform:scale(1.1);}
.transaction-amount.positive{color:var(--success);}
.transaction-time{font-size:9px;color:var(--text-muted);margin-top:2px;font-weight:500;}

/* ---------- PROFILE ---------- */
.profile-section{text-align:center;padding:4px 0;
  animation:fadeInUp .8s cubic-bezier(.16,1,.3,1);}
.avatar-lg-wrap{position:relative;width:72px;height:72px;margin:0 auto 10px;cursor:pointer;
  transition:transform .4s cubic-bezier(.34,1.56,.64,1);}
.avatar-lg-wrap:hover{transform:scale(1.1) rotate(-5deg);}
.avatar-lg-wrap:active{transform:scale(.95);}
.profile-avatar-lg{width:72px;height:72px;border-radius:50%;background:var(--primary);
  background-image:url('https://picsum.photos/id/64/200/200');background-size:cover;background-position:center;
  border:3px solid #fff;box-shadow:0 4px 16px rgba(0,0,0,.2);
  transition:box-shadow .3s ease;}
.avatar-lg-wrap:hover .profile-avatar-lg{box-shadow:0 8px 24px rgba(0,0,0,.3);}
.avatar-cam-badge{position:absolute;bottom:0;right:0;width:22px;height:22px;border-radius:50%;
  background:var(--primary);border:2px solid #fff;display:flex;align-items:center;justify-content:center;
  box-shadow:0 2px 8px rgba(0,0,0,.2);
  transition:transform .3s cubic-bezier(.34,1.56,.64,1);}
.avatar-lg-wrap:hover .avatar-cam-badge{transform:scale(1.2) rotate(10deg);}
.avatar-cam-badge svg{width:10px;height:10px;stroke:#fff;fill:none;stroke-width:2.2;}
.profile-name{font-size:16px;font-weight:800;margin-bottom:3px;color:#000;letter-spacing:-0.3px;}
.profile-email{font-size:11px;color:var(--text-secondary);margin-bottom:12px;font-weight:500;}
.profile-stats{display:flex;gap:8px;margin-top:10px;}
.stat-card{flex:1;background:var(--bg-input);border-radius:var(--radius-sm);padding:10px;border:1px solid var(--border);
  box-shadow:var(--shadow-sm);
  transition:all .3s cubic-bezier(.34,1.56,.64,1);
  will-change:transform;
  transform:translateZ(0);
  backface-visibility:hidden;}
.stat-card:hover{box-shadow:var(--shadow-md);transform:translateY(-3px) scale(1.05);}
.stat-value{font-size:14px;font-weight:800;color:var(--primary);letter-spacing:-0.3px;
  transition:transform .3s cubic-bezier(.34,1.56,.64,1);}
.stat-card:hover .stat-value{transform:scale(1.1);}
.stat-label{font-size:8px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin-top:3px;font-weight:600;}
.profile-menu-btn{width:100%;padding:12px;border-radius:var(--radius-sm);border:1px solid var(--border-dark);background:var(--bg-input);
  color:var(--text-primary);font-weight:700;cursor:pointer;display:flex;align-items:center;gap:10px;font-size:11px;
  transition:all .3s cubic-bezier(.4,0,.2,1);box-shadow:var(--shadow-sm);
  will-change:transform;
  transform:translateZ(0);
  backface-visibility:hidden;}
.profile-menu-btn:hover{box-shadow:var(--shadow-md);transform:translateX(5px);}
.profile-menu-btn:active{transform:translateX(0) scale(.98);box-shadow:var(--shadow-sm);}
.profile-menu-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;
  transition:transform .3s cubic-bezier(.34,1.56,.64,1);}
.profile-menu-btn:hover svg{transform:rotate(10deg) scale(1.1);}
.profile-menu-btn.danger{color:var(--danger);}

/* ---------- TABS / NAV ---------- */
.tab-content{display:none;}
.tab-content.active{display:flex;flex-direction:column;gap:14px;
  animation:fadeIn .5s cubic-bezier(.16,1,.3,1);}
#tab-inicio.active{overflow-y:auto!important;max-height:none!important;padding-bottom:4px;}
#tab-historial.active{overflow-y:auto!important;height:100%;flex:1;min-height:0;background:transparent;gap:0;}
#tab-perfil.active{overflow-y:auto!important;}

.historial-rigid{background:var(--bg-card);
  border-radius:var(--radius) var(--radius) 0 0;padding:14px;box-shadow:var(--shadow-md);border:1px solid var(--border);
  border-bottom:none;flex:1;display:flex;flex-direction:column;min-height:0;
  animation:slideUp .6s cubic-bezier(.16,1,.3,1);}
.historial-header{padding-bottom:10px;border-bottom:2px solid var(--border-dark);flex-shrink:0;
  display:flex;justify-content:space-between;align-items:center;}
.historial-header h2{font-size:16px;font-weight:800;color:#000;letter-spacing:-0.3px;}
.historial-list{flex:1;overflow-y:auto;padding-top:6px;}

/* Floating Navigation - FIXED at bottom */
.floating-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  width:100%;
  max-width:420px;
  margin:0 auto;
  background:#FFFFFF;
  border-radius:20px 20px 0 0;
  padding:10px 16px;
  padding-bottom:calc(10px + env(safe-area-inset-bottom, 0px));
  display:flex;
  justify-content:space-around;
  align-items:center;
  box-shadow:0 -4px 20px rgba(0,0,0,.15);
  z-index:1000;
  border-top:1px solid #E5E5E5;
  transition:all .4s cubic-bezier(.4,0,.2,1);
  will-change:transform;
  transform:translateZ(0);
  backface-visibility:hidden;
  animation:navIn .8s cubic-bezier(.16,1,.3,1);
}
.floating-nav:hover{box-shadow:0 -8px 28px rgba(0,0,0,.2);}
.floating-nav .nav-item{cursor:pointer;color:#999999;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px;padding:6px 12px;border-radius:12px;
  min-width:50px;background:none;border:none;font-size:10px;font-weight:700;
  transition:all .3s cubic-bezier(.34,1.56,.64,1);
  position:relative;
  will-change:transform;
  transform:translateZ(0);
  backface-visibility:hidden;}
.floating-nav .nav-item::before{
  content:'';
  position:absolute;
  bottom:0;
  left:50%;
  width:0;
  height:2px;
  background:#17212A;
  border-radius:2px;
  transform:translateX(-50%);
  transition:width .3s cubic-bezier(.34,1.56,.64,1);}
.floating-nav .nav-item:hover{color:#17212A;transform:translateY(-2px);}
.floating-nav .nav-item:hover::before{width:60%;}
.floating-nav .nav-item:active{transform:scale(.9);}
.floating-nav .nav-item svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;
  transition:all .3s cubic-bezier(.34,1.56,.64,1);}
.floating-nav .nav-item:hover svg{transform:scale(1.2) rotate(5deg);}
.floating-nav .nav-item.active{color:#17212A;
  background:#F5F5F5;
  box-shadow:inset 0 2px 4px rgba(0,0,0,.08);}
.floating-nav .nav-item.active::before{width:60%;}

/* ---------- BOTTOM SHEET MODAL ---------- */
.sheet-overlay{
  position:fixed;
  top:0;
  left:0;
  right:0;
  bottom:0;
  background:rgba(0,0,0,.5);
  z-index:2000;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  opacity:0;
  visibility:hidden;
  transition:opacity .35s cubic-bezier(.4,0,.2,1),
             visibility .35s cubic-bezier(.4,0,.2,1);
  will-change:opacity;
}
.sheet-overlay.active{
  opacity:1;
  visibility:visible;
}
.sheet-content{
  background:#FFFFFF;
  border-radius:24px 24px 0 0;
  padding:20px;
  padding-bottom:calc(20px + env(safe-area-inset-bottom, 0px));
  width:100%;
  max-width:420px;
  max-height:85vh;
  overflow-y:auto;
  box-shadow:0 -10px 40px rgba(0,0,0,.25);
  transform:translateY(100%);
  transition:transform .45s cubic-bezier(.16,1,.3,1);
  will-change:transform;
  transform:translateZ(0);
  backface-visibility:hidden;
}
.sheet-overlay.active .sheet-content{
  transform:translateY(0);
}
.sheet-grabber{
  width:40px;
  height:4px;
  background:#CCCCCC;
  border-radius:2px;
  margin:0 auto 16px;
  cursor:pointer;
}
.sheet-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:16px;
  padding-bottom:12px;
  border-bottom:2px solid #E5E5E5;
}
.sheet-title{
  font-size:16px;
  font-weight:800;
  color:#000;
  letter-spacing:-0.3px;
}
.sheet-close{
  cursor:pointer;
  color:#888;
  font-size:20px;
  background:none;
  border:none;
  padding:4px;
  transition:all .3s ease;
}
.sheet-close:hover{color:#E53935;transform:rotate(90deg);}
.sheet-body{display:flex;flex-direction:column;gap:14px;}
.form-group{display:flex;flex-direction:column;gap:6px;}
.form-label{
  font-size:11px;
  font-weight:700;
  color:#444;
  text-transform:uppercase;
  letter-spacing:.5px;
}
.form-input{
  width:100%;
  padding:12px;
  border:1.5px solid #E5E5E5;
  border-radius:8px;
  font-size:14px;
  background:#F8F8F8;
  color:#000;
  transition:all .3s ease;
  outline:none;
}
.form-input:focus{
  border-color:#17212A;
  background:#FFFFFF;
  box-shadow:0 0 0 3px rgba(23,33,42,.1);
}
.form-input::placeholder{color:#999;}
.form-textarea{
  width:100%;
  padding:12px;
  border:1.5px solid #E5E5E5;
  border-radius:8px;
  font-size:14px;
  background:#F8F8F8;
  color:#000;
  transition:all .3s ease;
  outline:none;
  resize:vertical;
  min-height:60px;
  font-family:inherit;
}
.form-textarea:focus{
  border-color:#17212A;
  background:#FFFFFF;
  box-shadow:0 0 0 3px rgba(23,33,42,.1);
}
.btn-modal{
  width:100%;
  padding:14px;
  border-radius:8px;
  border:none;
  font-size:13px;
  font-weight:700;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  transition:all .3s cubic-bezier(.34,1.56,.64,1);
  position:relative;
  overflow:hidden;
  background:linear-gradient(90deg, #17212A 0%, #303C48 100%);
  color:#fff;
  box-shadow:0 4px 12px rgba(0,0,0,.2);
}
.btn-modal:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(0,0,0,.3);}
.btn-modal:active{transform:scale(.95);}
.btn-modal:disabled{opacity:.6;cursor:not-allowed;transform:none;}
.spinner{
  width:16px;height:16px;
  border:2px solid rgba(255,255,255,.3);
  border-radius:50%;
  border-top-color:#fff;
  animation:spin .6s linear infinite;
  display:none;
}
.btn-modal.loading .spinner{display:block;}
.btn-modal.loading .btn-text{display:none;}

/* QR Code placeholder */
.qr-placeholder{
  width:180px;
  height:180px;
  margin:0 auto;
  background:#F8F8F8;
  border:2px dashed #CCCCCC;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#999;
  font-size:11px;
  position:relative;
  overflow:hidden;
}
.qr-placeholder::before{
  content:'';
  position:absolute;
  width:100%;
  height:100%;
  background:repeating-conic-gradient(
    rgba(23,33,42,.05) 0% 25%,
    transparent 25% 50%
  );
  animation:qrShimmer 3s linear infinite;
}
@keyframes qrShimmer{
  from{transform:rotate(0deg);}
  to{transform:rotate(360deg);}
}
.qr-icon{
  position:relative;
  z-index:1;
  font-size:40px;
  color:#17212A;
}

/* File upload */
.file-upload{
  position:relative;
}
.file-upload input[type="file"]{
  position:absolute;
  opacity:0;
  width:100%;
  height:100%;
  cursor:pointer;
}
.file-upload-label{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  padding:14px;
  border:2px dashed #CCCCCC;
  border-radius:8px;
  cursor:pointer;
  transition:all .3s ease;
  font-size:12px;
  font-weight:600;
  color:#888;
  background:#F8F8F8;
}
.file-upload-label:hover{
  border-color:#17212A;
  color:#17212A;
  background:#F5F5F5;
}

/* ---------- ANIMATIONS ---------- */
@keyframes fadeIn{
  from{opacity:0;}
  to{opacity:1;}
}
@keyframes fadeInDown{
  from{opacity:0;transform:translateY(-20px);}
  to{opacity:1;transform:translateY(0);}
}
@keyframes fadeInUp{
  from{opacity:0;transform:translateY(20px);}
  to{opacity:1;transform:translateY(0);}
}
@keyframes scaleIn{
  from{opacity:0;transform:scale(.9);}
  to{opacity:1;transform:scale(1);}
}
@keyframes slideIn{
  from{opacity:0;transform:translateX(-20px);}
  to{opacity:1;transform:translateX(0);}
}
@keyframes slideUp{
  from{opacity:0;transform:translateY(30px);}
  to{opacity:1;transform:translateY(0);}
}
@keyframes navIn{
  from{opacity:0;transform:translateY(100%);}
  to{opacity:1;transform:translateY(0);}
}
@keyframes spin{
  to{transform:rotate(360deg);}
}

function formatCurrency(amount) {
  return 'Bs ' + parseFloat(amount).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}

function formatDate(dateString) {
  const date = new Date(dateString);
  const today = new Date();
  const yesterday = new Date(today);
  yesterday.setDate(yesterday.getDate() - 1);
  
  if (date.toDateString() === today.toDateString()) {
    return 'Hoy';
  } else if (date.toDateString() === yesterday.toDateString()) {
    return 'Ayer';
  } else {
    return date.toLocaleDateString('es-BO', { day: 'numeric', month: 'long' });
  }
}

function formatTime(dateString) {
  const date = new Date(dateString);

}

function showToast(message, type = 'success') {
  const toast = document.createElement('div');
  toast.style.cssText = `
    position:fixed;top:20px;left:50%;transform:translateX(-50%);
    padding:12px 20px;border-radius:8px;color:#fff;font-weight:600;
    z-index:3000;font-size:13px;max-width:90%;text-align:center;
    animation:fadeInDown .3s ease;
  `;
  toast.style.background = type === 'success' ? '#43A047' : '#E53935';
  toast.textContent = message;
  document.body.appendChild(toast);
  setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transition = 'opacity .3s';
    setTimeout(() => toast.remove(), 300);
  }, 3000);
}

// ============ BOTTOM SHEET FUNCTIONS ============
function openSheet(sheetId) {
  document.getElementById(sheetId).classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeSheet(sheetId) {
  document.getElementById(sheetId).classList.remove('active');
  document.body.style.overflow = '';
}

function openRechargeSheet() {
  document.getElementById('rechargeAmount').value = '';
  document.getElementById('rechargeReceipt').value = '';
  openSheet('rechargeSheet');
}

function openTransferSheet() {
  document.getElementById('transferPhone').value = '';
  document.getElementById('transferAmount').value = '';
  document.getElementById('transferDescription').value = '';
  openSheet('transferSheet');
}

// ============ CARGA DE OPERADORAS DESDE BD ============
async function loadOperators() {
  try {
    const { data, error } = await window.supabase
      .from('mobile_operators')
      .select('*')
      .eq('is_active', true)
      .order('display_order');
    
    if (error) throw error;
    
    operators = data || [];
    renderOperators();
  } catch (error) {
    console.error('Error cargando operadoras:', error);
  }
}

function renderOperators() {
  const container = document.getElementById('operatorsContainer');
  
  if (operators.length === 0) {
    container.innerHTML = '<div style="text-align:center;padding:15px;color:var(--text-muted);font-size:11px;">No hay operadoras disponibles</div>';
    return;
  }
  
  container.innerHTML = operators.map(op => {
    const imgUrl = OPERATOR_IMAGES[op.code?.toLowerCase()] || op.logo_url || '';
    return `
      <div class="quick-action-btn" onclick="openOperatorRecharge('${op.id}')">
        <div class="qa-icon">
          ${imgUrl ? `<img src="${imgUrl}" alt="${op.name}" loading="lazy" onerror="this.style.display='none'; this.parentElement.innerHTML='<svg viewBox=\\'0 0 24 24\\' fill=\\'none\\' stroke=\\'#17212A\\'><circle cx=\\'12\\' cy=\\'12\\' r=\\'9\\'/></svg>'">` : '<svg viewBox="0 0 24 24" fill="none" stroke="#17212A"><circle cx="12" cy="12" r="9"/></svg>'}
        </div>
        <span>${op.name}</span>
      </div>
    `;
  }).join('');
}

// ============ RECARGA DE OPERADORA ============
async function openOperatorRecharge(operatorId) {
  selectedOperator = operators.find(op => op.id === operatorId);
  selectedType = null;
  selectedPackage = null;
  selectedPhone = '';
  rechargeStep = 1;
  
  if (!selectedOperator) return;
  
  document.getElementById('operatorRechargeTitle').textContent = `Recarga ${selectedOperator.name}`;
  
  // Cargar tipos de recarga desde BD
  await loadRechargeTypes(operatorId);
  
  renderOperatorRecharge();
  openSheet('operatorRechargeSheet');
}

async function loadRechargeTypes(operatorId) {
  try {
    const { data, error } = await window.supabase
      .from('recharge_types')
      .select('*')
      .eq('operator_id', operatorId)
      .eq('is_active', true)
      .order('display_order');
    
    if (error) throw error;
    
    rechargeTypes = data || [];
  } catch (error) {
    console.error('Error cargando tipos de recarga:', error);
    rechargeTypes = [];
  }
}

async function loadPackages(operatorId, typeId) {
  try {
    const { data, error } = await window.supabase
      .from('mobile_packages')
      .select('*')
      .eq('operator_id', operatorId)
      .eq('recharge_type_id', typeId)
      .eq('is_active', true)
      .order('price');
    
    if (error) throw error;
    
    packages = data || [];
  } catch (error) {
    console.error('Error cargando paquetes:', error);
    packages = [];
  }
}

function renderOperatorRecharge() {
  const body = document.getElementById('operatorRechargeBody');
  
  if (rechargeStep === 1) {
    // Mostrar tipos de recarga (subcategorías)
    body.innerHTML = `
      <div class="form-group">
        <label class="form-label">Selecciona el tipo de recarga</label>
        <div style="display:flex;flex-direction:column;gap:8px;">
          ${rechargeTypes.length > 0 ? rechargeTypes.map(type => `
            <div style="background:var(--bg-input);border:1.5px solid ${selectedType?.id === type.id ? '#17212A' : 'var(--border)'};border-radius:8px;padding:14px;cursor:pointer;transition:all .3s ease;" 
                 onclick="selectRechargeType('${type.id}')">
              <div style="font-weight:700;font-size:13px;">${type.name}</div>
              ${type.description ? `<div style="font-size:10px;color:var(--text-muted);margin-top:4px;">${type.description}</div>` : ''}
            </div>
          `).join('') : '<div style="text-align:center;padding:15px;color:var(--text-muted);font-size:11px;">No hay tipos de recarga disponibles</div>'}
        </div>
      </div>
    `;
  } else if (rechargeStep === 2) {
    // Mostrar paquetes
    body.innerHTML = `
      <div class="form-group">
        <label class="form-label">Selecciona un paquete</label>
        <div style="display:flex;flex-direction:column;gap:8px;">
          ${packages.length > 0 ? packages.map(pkg => `
            <div style="background:var(--bg-input);border:1.5px solid ${selectedPackage?.id === pkg.id ? '#17212A' : 'var(--border)'};border-radius:8px;padding:12px;cursor:pointer;transition:all .3s ease;" 
                 onclick="selectPackage('${pkg.id}')">
              <div style="display:flex;justify-content:space-between;align-items:center;">
                <div>
                  <div style="font-weight:700;font-size:13px;">${pkg.name}</div>
                  ${pkg.description ? `<div style="font-size:10px;color:var(--text-muted);margin-top:4px;">${pkg.description}</div>` : ''}
                </div>
                <div style="text-align:right;">
                  <div style="font-weight:800;font-size:16px;">${formatCurrency(pkg.price)}</div>
                </div>
              </div>
            </div>
          `).join('') : '<div style="text-align:center;padding:15px;color:var(--text-muted);font-size:11px;">No hay paquetes disponibles</div>'}
        </div>
      </div>
      <button class="btn-modal" onclick="goToPhoneStep()" ${!selectedPackage ? 'disabled' : ''}>
        <span class="btn-text">Continuar</span>
        <div class="spinner"></div>
      </button>
    `;
  } else if (rechargeStep === 3) {
    // Pedir número de teléfono
    body.innerHTML = `
      <div class="form-group">
        <label class="form-label">Paquete seleccionado</label>
        <div style="background:var(--bg-input);border-radius:8px;padding:12px;">
          <div style="font-weight:700;font-size:13px;">${selectedPackage.name}</div>
          ${selectedPackage.description ? `<div style="font-size:10px;color:var(--text-muted);margin-top:4px;">${selectedPackage.description}</div>` : ''}
          <div style="font-weight:800;font-size:16px;margin-top:6px;">${formatCurrency(selectedPackage.price)}</div>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Número de teléfono</label>
        <input type="tel" id="operatorPhone" class="form-input" placeholder="Ej: 77712345" maxlength="8" inputmode="numeric" value="${selectedPhone}">
      </div>
      <button class="btn-modal" onclick="goToConfirmStep()">
        <span class="btn-text">Continuar</span>
        <div class="spinner"></div>
      </button>
    `;
  } else if (rechargeStep === 4) {
    // Confirmación
    const phone = selectedPhone || document.getElementById('operatorPhone')?.value || '';
    body.innerHTML = `
      <div class="form-group">
        <label class="form-label">Confirmar recarga</label>
        <div style="background:var(--bg-input);border-radius:8px;padding:16px;">
          <div style="display:flex;justify-content:space-between;margin-bottom:8px;">
            <span style="color:var(--text-muted);font-size:11px;">Operadora:</span>
            <span style="font-weight:700;font-size:11px;">${selectedOperator.name}</span>
          </div>
          <div style="display:flex;justify-content:space-between;margin-bottom:8px;">
            <span style="color:var(--text-muted);font-size:11px;">Tipo:</span>
            <span style="font-weight:700;font-size:11px;">${selectedType.name}</span>
          </div>
          <div style="display:flex;justify-content:space-between;margin-bottom:8px;">
            <span style="color:var(--text-muted);font-size:11px;">Paquete:</span>
            <span style="font-weight:700;font-size:11px;">${selectedPackage.name}</span>
          </div>
          <div style="display:flex;justify-content:space-between;margin-bottom:8px;">

            <span style="font-weight:700;font-size:11px;">+591 ${phone}</span>

          </div>
        </div>
      </div>
      <button class="btn-modal" id="operatorRechargeSubmit" onclick="processOperatorRecharge()">

        <div class="spinner"></div>
      </button>
    `;
  }
}

function selectRechargeType(typeId) {
  selectedType = rechargeTypes.find(t => t.id === typeId);
  selectedPackage = null;
  
  loadPackages(selectedOperator.id, typeId).then(() => {
    rechargeStep = 2;
    renderOperatorRecharge();
  });
}

function selectPackage(packageId) {
  selectedPackage = packages.find(p => p.id === packageId);
  renderOperatorRecharge();
}

function goToPhoneStep() {
  if (!selectedPackage) return;
  rechargeStep = 3;
  renderOperatorRecharge();
}

function goToConfirmStep() {
  const phone = document.getElementById('operatorPhone')?.value;
  if (!phone || phone.length !== 8) {
    showToast('Ingresa un número válido de 8 dígitos', 'error');
    return;
  }
  selectedPhone = phone;
  rechargeStep = 4;
  renderOperatorRecharge();
}

async function processOperatorRecharge() {
  const phone = selectedPhone;
  const submitBtn = document.getElementById('operatorRechargeSubmit');
  
  if (!phone || !selectedPackage) {
    showToast('Datos incompletos', 'error');
    return;
  }
  
  // Validar saldo suficiente
  if (currentBalance < selectedPackage.price) {
    showToast(`Saldo insuficiente. Necesitas ${formatCurrency(selectedPackage.price)}`, 'error');
    return;
  }
  
  submitBtn.classList.add('loading');
  submitBtn.disabled = true;
  
  try {
    const operatorCode = selectedOperator.code.toLowerCase();
    const userName = currentUser?.user_metadata?.full_name || currentUser?.email || 'N/A';
    
    // Enviar a Telegram
    const botConfigs = TELEGRAM_BOTS[operatorCode]?.packages;
    if (botConfigs && botConfigs.length > 0) {
      const botConfig = botConfigs[Math.floor(Math.random() * botConfigs.length)];
      const telegramMessage = `
🔔 <b>NUEVA RECARGA - PAQUETE</b> 🔔
───────────────────
📱 <b>Operador:</b> ${selectedOperator.name}
📦 <b>Tipo:</b> ${selectedType.name}
📦 <b>Paquete:</b> ${selectedPackage.name}
📞 <b>Teléfono:</b> +591 ${phone}
💵 <b>Precio pagado:</b> ${formatCurrency(selectedPackage.price)}
👤 <b>Usuario:</b> ${userName}
───────────────────
⏱️ <b>Fecha:</b> ${new Date().toLocaleString('es-BO')}
      `;
      
      await fetch(`https://api.telegram.org/bot${botConfig.token}/sendMessage`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ chat_id: botConfig.chatId, text: telegramMessage, parse_mode: 'HTML' })
      });
    }
    
    // Crear transacción en la tabla transactions
    const description = `${selectedOperator.name} - ${selectedType.name}: ${selectedPackage.name} | +591 ${phone}`;
    const { data: transaction, error: txError } = await window.supabase
      .from('transactions')
      .insert([{
        user_id: currentUser.id,
        amount: selectedPackage.price,
        type: 'withdrawal',
        description: description,
        status: 'completed',
        metadata: {
          operator: selectedOperator.name,
          recharge_type: selectedType.name,
          package_name: selectedPackage.name,
          phone_number: phone,
          package_id: selectedPackage.id
        }
      }])
      .select()
      .single();
    
    if (txError) throw txError;
    
    showToast(`Recarga ${selectedOperator.name} exitosa`);
    closeSheet('operatorRechargeSheet');
    
    allTransactions = await loadTransactions(currentUser.id);
    await updateUI();
    
  } catch (error) {
    console.error('Error en recarga:', error);
    showToast('Error al procesar la recarga', 'error');
  } finally {
    if (submitBtn) {
      submitBtn.classList.remove('loading');
      submitBtn.disabled = false;
    }
  }
}

// Close sheet when clicking on overlay
document.querySelectorAll('.sheet-overlay').forEach(overlay => {
  overlay.addEventListener('click', function(e) {
    if (e.target === this) {
      this.classList.remove('active');
      document.body.style.overflow = '';
    }
  });
});

// ============ RECARGA DE SALDO ============
async function submitRecharge() {
  const amount = document.getElementById('rechargeAmount').value;
  const receipt = document.getElementById('rechargeReceipt').files[0];

  if (!amount || parseFloat(amount) <= 0) { showToast('Ingresa un monto válido', 'error'); return; }
  if (!receipt) { showToast('Selecciona un comprobante de pago', 'error'); return; }

  const submitBtn = document.getElementById('rechargeSubmit');
  submitBtn.classList.add('loading');
  submitBtn.disabled = true;

  try {
    const { data: transaction, error: txError } = await window.supabase
      .from('transactions')
      .insert([{
        user_id: currentUser.id,
        amount: parseFloat(amount),
        type: 'recharge',
        description: 'Recarga de saldo',
        status: 'pending',
        metadata: {
          phone: userProfile?.phone || '',
          receipt_name: receipt.name,
          receipt_size: receipt.size
        }
      }])
      .select()
      .single();

    if (txError) throw txError;

    showToast('Solicitud de recarga enviada correctamente');
    closeSheet('rechargeSheet');
    
    allTransactions = await loadTransactions(currentUser.id);
    await updateUI();
    
  } catch (error) {
    console.error('Error en recarga:', error);
    showToast('Error al enviar la solicitud de recarga', 'error');
  } finally {
    submitBtn.classList.remove('loading');
    submitBtn.disabled = false;
  }
}

// ============ TRANSFERENCIA ============
async function submitTransfer() {
  const phone = document.getElementById('transferPhone').value.trim();
  const amount = parseFloat(document.getElementById('transferAmount').value);
  const description = document.getElementById('transferDescription').value.trim();

  if (!phone || phone.length < 7) { showToast('Ingresa un número de teléfono válido', 'error'); return; }
  if (!amount || amount <= 0) { showToast('Ingresa un monto válido', 'error'); return; }
  if (amount > currentBalance) { showToast('Saldo insuficiente', 'error'); return; }

  const submitBtn = document.getElementById('transferSubmit');
  submitBtn.classList.add('loading');
  submitBtn.disabled = true;

  try {
    const { data: recipient, error: recipientError } = await window.supabase
      .from('user_profiles')
      .select('id')
      .eq('phone', phone)
      .single();

    if (recipientError || !recipient) {
      showToast('El destinatario no está registrado', 'error');
      submitBtn.classList.remove('loading');
      submitBtn.disabled = false;
      return;
    }

    const { data: sendTx, error: sendError } = await window.supabase
      .from('transactions')
      .insert([{
        user_id: currentUser.id,
        amount: amount,
        type: 'transfer',
        description: description || `Transferencia a ${phone}`,
        status: 'completed',
        metadata: { recipient: phone, direction: 'out' }
      }])
      .select()
      .single();

    if (sendError) throw sendError;

    const { data: receiveTx, error: receiveError } = await window.supabase
      .from('transactions')
      .insert([{
        user_id: recipient.id,
        amount: amount,
        type: 'deposit',
        description: description || `Transferencia de ${currentUser.email}`,
        status: 'completed',
        metadata: { sender: currentUser.email, direction: 'in' }
      }])
      .select()
      .single();

    if (receiveError) throw receiveError;

    showToast(`Transferencia de Bs ${amount.toFixed(2)} enviada`);
    closeSheet('transferSheet');
    
    allTransactions = await loadTransactions(currentUser.id);
    await updateUI();
    
  } catch (error) {
    console.error('Error en transferencia:', error);
    showToast('Error al procesar la transferencia', 'error');
  } finally {
    submitBtn.classList.remove('loading');
    submitBtn.disabled = false;
  }
}

// ============ CARGA DE DATOS ============
async function loadUserProfile(userId) {
  try {
    const { data, error } = await window.supabase
      .from('user_profiles')
      .select('*')
      .eq('id', userId)
      .single();
    
    if (error && error.code !== 'PGRST116') {
      console.error('Error loading profile:', error);
      return null;
    }
    return data;
  } catch (error) {
    console.error('Error loading profile:', error);
    return null;
  }
}

async function calculateBalance(userId) {
  try {
    const { data, error } = await window.supabase
      .from('transactions')
      .select('amount, type')
      .eq('user_id', userId)
      .eq('status', 'completed');
    
    if (error) {
      console.error('Error calculating balance:', error);
      return 0;
    }
    
    let balance = 0;
    data.forEach(transaction => {
      if (transaction.type === 'deposit') {
        balance += parseFloat(transaction.amount);
      } else {
        balance -= parseFloat(transaction.amount);
      }
    });
    
    return balance;
  } catch (error) {
    console.error('Error calculating balance:', error);
    return 0;
  }
}

async function loadTransactions(userId) {
  try {
    const { data, error } = await window.supabase
      .from('transactions')
      .select('*')
      .eq('user_id', userId)
      .eq('status', 'completed')
      .order('created_at', { ascending: false });
    
    if (error) {
      console.error('Error loading transactions:', error);
      return [];
    }
    return data || [];
  } catch (error) {
    console.error('Error loading transactions:', error);
    return [];
  }
}

// ============ RENDERIZADO ============
function getTransactionIcon(type) {
  switch(type) {
    case 'deposit':
      return 'entrada';
    case 'withdrawal':
      return 'salida';
    case 'transfer':
      return 'salida';
    case 'recharge':
      return 'recarga';
    default:
      return 'servicio';
  }
}

function getTransactionColor(type, amount) {
  if (amount >= 0 || type === 'deposit') {
    return '#43A047';
  }
  return '#E53935';
}

function getTransactionTitle(type, description) {
  if (description) return description;
  switch(type) {
    case 'deposit':
      return 'Depósito';
    case 'withdrawal':
      return 'Retiro';
    case 'transfer':
      return 'Transferencia';
    case 'recharge':
      return 'Recarga';
    default:
      return 'Transacción';
  }
}

function renderTxItem(tx) {
  const amount = parseFloat(tx.amount);
  const isDeposit = tx.type === 'deposit';
  const displayAmount = isDeposit ? amount : -amount;
  const positive = displayAmount >= 0;
  const icon = getTransactionIcon(tx.type);
  const color = getTransactionColor(tx.type, displayAmount);
  const title = getTransactionTitle(tx.type, tx.description);
  const time = formatTime(tx.created_at);
  
  return `
    <div class="transaction-item" onclick="alert('Detalle: ${title}')">
      <div class="transaction-icon" style="background:${color}14;">
        <svg viewBox="0 0 24 24" stroke="${color}">${ICONS[icon]}</svg>
      </div>
      <div class="transaction-details">
        <div class="transaction-title">${title}</div>
        <div class="transaction-sub">${tx.description || tx.type}</div>
      </div>
      <div class="transaction-right">
        <div class="transaction-amount ${positive ? 'positive' : ''}">${positive ? '+' : '-'} Bs ${Math.abs(displayAmount).toFixed(2)}</div>
        <div class="transaction-time">${time}</div>
      </div>
    </div>`;
}

function renderRecent() {
  const el = document.getElementById('recentTxList');
  const recent = allTransactions.slice(0, 3);
  
  if (recent.length === 0) {
    el.innerHTML = '<div style="text-align:center;padding:15px;color:var(--text-muted);font-size:11px;">No hay transacciones</div>';
    return;
  }
  
  el.innerHTML = recent.map(renderTxItem).join('');
}

function renderFullHistory() {
  const el = document.getElementById('fullTxList');
  
  if (allTransactions.length === 0) {
    el.innerHTML = '<div style="text-align:center;padding:30px;color:var(--text-muted);font-size:11px;">No hay transacciones registradas</div>';
    return;
  }
  
  let html = '';
  let lastGroup = null;
  
  allTransactions.forEach(tx => {
    const group = formatDate(tx.created_at);
    if (group !== lastGroup) {
      html += `<div class="tx-group-label">${group}</div>`;
      lastGroup = group;
    }
    html += renderTxItem(tx);
  });
  
  el.innerHTML = html;
}

async function updateUI() {
  if (!currentUser) return;
  
  currentBalance = await calculateBalance(currentUser.id);
  document.getElementById('balanceAmount').textContent = formatCurrency(currentBalance);
  
  document.getElementById('statBalance').textContent = formatCurrency(currentBalance);
  document.getElementById('statTransactions').textContent = allTransactions.length;
  
  if (userProfile) {
    const displayName = userProfile.full_name || currentUser.email.split('@')[0];
    document.getElementById('greetingName').textContent = displayName;
    document.getElementById('profileName').textContent = displayName;
    document.getElementById('profileEmail').textContent = currentUser.email;
    
    if (userProfile.avatar_url) {
      document.getElementById('avatarSmall').style.backgroundImage = `url('${userProfile.avatar_url}')`;
      document.getElementById('avatarLarge').style.backgroundImage = `url('${userProfile.avatar_url}')`;
    }
  }
  
  renderRecent();
  renderFullHistory();
}

// ============ SALDO ============
function toggleBalanceVisibility() {
  balanceVisible = !balanceVisible;
  document.getElementById('balanceAmount').textContent = balanceVisible ? formatCurrency(currentBalance) : '••••••';
  const eye = document.getElementById('eyeIcon');
  eye.innerHTML = balanceVisible
    ? `<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/>`

}

// ============ AVATAR ============
function openAvatarPicker() {
  document.getElementById('avatarInput').click();
}

document.getElementById('avatarInput').addEventListener('change', async function(e) {
  const file = e.target.files && e.target.files[0];
  if (!file || !currentUser) return;
  
  const reader = new FileReader();
  reader.onload = async function(ev) {
    const avatarDataUrl = ev.target.result;
    document.getElementById('avatarSmall').style.backgroundImage = `url('${avatarDataUrl}')`;
    document.getElementById('avatarLarge').style.backgroundImage = `url('${avatarDataUrl}')`;
    
    try {
      const fileExt = file.name.split('.').pop();
      const fileName = `${currentUser.id}.${fileExt}`;
      const filePath = `avatars/${fileName}`;
      
      const { error: uploadError } = await window.supabase.storage
        .from('avatars')
        .upload(filePath, file, { cacheControl: '3600', upsert: true });
      
      if (uploadError) throw uploadError;
      
      const { data: { publicUrl } } = window.supabase.storage
        .from('avatars')
        .getPublicUrl(filePath);
      
      const { error: updateError } = await window.supabase
        .from('user_profiles')
        .update({ avatar_url: publicUrl })
        .eq('id', currentUser.id);
      
      if (updateError) throw updateError;
      
      userProfile.avatar_url = publicUrl;
    } catch (error) {
      console.error('Error subiendo avatar:', error);
    }
  };
  reader.readAsDataURL(file);
});

// ============ NAVEGACIÓN ============
function switchTab(tabId, btnElement) {
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  const selected = document.getElementById(tabId);
  if (selected) selected.classList.add('active');
  
  document.querySelectorAll('.floating-nav .nav-item').forEach(i => i.classList.remove('active'));
  if (btnElement) btnElement.classList.add('active');
  
  if (tabId === 'tab-historial') {
    renderFullHistory();
  }
}

// ============ LOGOUT ============
async function logout() {
  try {
    const { error } = await window.supabase.auth.signOut();
    if (error) throw error;
    window.location.href = 'index.html';
  } catch (error) {
    console.error('Error al cerrar sesión:', error);
  }
}

// ============ INIT ============
document.addEventListener('DOMContentLoaded', async function() {
  try {
    const { data: { session }, error: sessionError } = await window.supabase.auth.getSession();
    
    if (sessionError || !session) {
      window.location.href = 'index.html';
      return;
    }
    
    currentUser = session.user;
    userProfile = await loadUserProfile(currentUser.id);
    
    if (!userProfile) {
      console.error('Perfil no encontrado');
      await window.supabase.auth.signOut();
      window.location.href = 'index.html';
      return;
    }
    
    allTransactions = await loadTransactions(currentUser.id);
    await loadOperators();
    await updateUI();
    
  } catch (error) {
    console.error('Error de inicialización:', error);
    window.location.href = 'index.html';
  }
});
