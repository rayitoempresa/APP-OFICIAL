<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta id="theme-color" name="theme-color" content="#0B1120">
<title>Mi Billetera · Rayito</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --primary:#5C6169;
  --primary-dark:#454951;
  --gold:#D4AF37;
  --bg-body:#EEF1F8;
  --bg-card:#FFFFFF;
  --bg-card-hover:#F7F9FF;
  --bg-module:#FFFFFF;
  --bg-input:#F1F4FB;
  --border:#E3E8F4;
  --text-primary:#0B1120;
  --text-secondary:#5B6478;
  --text-muted:#98A1B5;
  --danger:#E0473C;
  --success:#16A34A;
  --shadow:0 18px 35px -14px rgba(15,23,42,.14);
  --shadow-lg:0 25px 45px -15px rgba(15,23,42,.22);
  --nav-bg:rgba(255,255,255,.92);
  --nav-border:rgba(226,232,240,.8);
  --radius:22px;
  --card-grad-1:#3B3F46;
  --card-grad-2:#5C6169;
  --card-grad-3:#8A8F97;
  --card-text:#F5F5F3;
  --card-text-dim:rgba(245,245,243,.62);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
[data-theme="dark"]{
  --bg-body:#080B14;
  --bg-card:#111726;
  --bg-card-hover:#161D30;
  --bg-module:#111726;
  --bg-input:#161D30;
  --border:#232C42;
  --text-primary:#F3F5FC;
  --text-secondary:#8A93AC;
  --text-muted:#5C6379;
  --shadow:0 18px 35px -14px rgba(0,0,0,.65);
  --shadow-lg:0 25px 45px -15px rgba(0,0,0,.75);
  --nav-bg:rgba(17,23,38,.92);
  --nav-border:rgba(35,44,66,.7);
  --card-grad-1:#26282D;
  --card-grad-2:#44474D;
  --card-grad-3:#6E727A;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;
  font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
  scrollbar-width:none!important;-ms-overflow-style:none!important;}
*::-webkit-scrollbar{display:none!important;width:0!important;height:0!important;}
body{background:var(--bg-body);color:var(--text-primary);min-height:100vh;min-height:100dvh;
  display:flex;justify-content:center;align-items:center;padding:20px;padding-bottom:90px;
  overscroll-behavior:none;position:relative;overflow:hidden;
  transition:background-color .3s ease,color .3s ease;}
.wallet-container{width:100%;max-width:380px;display:flex;flex-direction:column;gap:16px;
  position:relative;overflow:hidden;height:calc(100vh - 110px);max-height:780px;}

/* ---------- HEADER ---------- */
.header{display:flex;justify-content:space-between;align-items:center;flex-shrink:0;padding:2px 2px 4px;}
.header-left{display:flex;align-items:center;gap:11px;}
.avatar-wrap{position:relative;width:42px;height:42px;flex-shrink:0;cursor:pointer;}
.profile-img{width:42px;height:42px;border-radius:50%;background:var(--primary);
  background-image:url('https://picsum.photos/id/64/100/100');background-size:cover;background-position:center;
  border:2px solid var(--bg-body);box-shadow:0 0 0 1.5px var(--primary);}
.avatar-cam-dot{position:absolute;bottom:-2px;right:-2px;width:16px;height:16px;border-radius:50%;
  background:var(--primary);border:2px solid var(--bg-body);display:flex;align-items:center;justify-content:center;}
.avatar-cam-dot svg{width:8px;height:8px;stroke:#fff;fill:none;stroke-width:2.5;}
.greeting-name{font-size:14px;font-weight:700;color:var(--text-primary);line-height:1.15;}
.greeting-sub{font-size:11.5px;color:var(--text-muted);margin-top:1px;}
.header-actions{display:flex;align-items:center;gap:6px;}
.icon-btn{cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text-secondary);
  background:var(--bg-input);border:1px solid var(--border);width:36px;height:36px;border-radius:12px;}
.icon-btn:active{background:var(--bg-card-hover);}

/* ---------- DEBIT CARD ---------- */
.debit-card{
  position:relative;border-radius:24px;padding:22px 20px 20px;overflow:hidden;flex-shrink:0;
  background:
    radial-gradient(120% 140% at 100% 0%, var(--card-grad-3) 0%, transparent 55%),
    linear-gradient(135deg, var(--card-grad-2) 0%, var(--card-grad-1) 65%);
  color:var(--card-text);box-shadow:var(--shadow-lg);
  min-height:190px;display:flex;flex-direction:column;justify-content:space-between;
}
.debit-card::before{
  content:'';position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:
    repeating-linear-gradient(115deg, rgba(255,255,255,.05) 0px, rgba(255,255,255,.05) 1px, transparent 1px, transparent 46px);
}
.card-row-top{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:1;}
.card-chip{width:38px;height:29px;border-radius:6px;
  background:linear-gradient(135deg,#F4E5B2 0%, var(--gold) 55%, #B4881F 100%);
  position:relative;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15);}
.card-chip::before,.card-chip::after{content:'';position:absolute;left:6px;right:6px;height:1px;background:rgba(0,0,0,.22);}
.card-chip::before{top:9px;}
.card-chip::after{top:19px;}
.contactless{width:22px;height:22px;stroke:var(--card-text-dim);fill:none;stroke-width:1.8;stroke-linecap:round;}
.card-issuer{font-size:11px;letter-spacing:.6px;color:var(--card-text-dim);font-weight:600;text-align:right;}
.card-row-mid{position:relative;z-index:1;}
.balance-label-row{display:flex;align-items:center;gap:7px;margin-bottom:4px;}
.balance-label{font-size:12.5px;color:var(--card-text-dim);}
.eye-toggle{cursor:pointer;display:flex;color:var(--card-text-dim);}
.eye-toggle svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;}
.balance-amount{font-size:29px;font-weight:700;letter-spacing:.2px;font-variant-numeric:tabular-nums;}
.card-row-bottom{display:flex;align-items:flex-end;position:relative;z-index:1;margin-top:16px;}
.brand-mark-inline{position:relative;width:44px;height:26px;flex-shrink:0;}
.brand-mark-inline .c1{position:absolute;left:0;top:0;width:26px;height:26px;border-radius:50%;background:rgba(245,245,243,.85);}
.brand-mark-inline .c2{position:absolute;left:16px;top:0;width:26px;height:26px;border-radius:50%;
  background:var(--gold);mix-blend-mode:normal;opacity:.92;}

/* ---------- ACTIONS ---------- */
.module-window{background:linear-gradient(180deg,var(--bg-card) 0%, var(--bg-module) 100%);
  border-radius:var(--radius);padding:18px 16px;box-shadow:var(--shadow);border:1px solid var(--border);flex-shrink:0;}
.buttons-row{display:flex;gap:10px;}
.btn{flex:1;padding:13px;border-radius:14px;border:none;font-size:13.5px;font-weight:600;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:7px;}
.btn-recharge{background:var(--primary);color:#fff;}
.btn-recharge:active{background:var(--primary-dark);}
.btn-pay{background:var(--bg-input);color:var(--text-primary);border:1px solid var(--border);}
.btn-pay:active{background:var(--bg-card-hover);}

.section-title{font-size:14px;font-weight:700;color:var(--text-primary);margin-bottom:14px;
  display:flex;align-items:center;gap:8px;}
.section-title::after{content:'';flex:1;height:1px;background:var(--border);}
.link-small{font-size:11.5px;font-weight:600;color:var(--primary);cursor:pointer;}

.quick-actions-row{display:flex;gap:10px;margin-bottom:18px;}
.quick-action-btn{flex:1;background:var(--bg-input);border:1px solid var(--border);border-radius:16px;
  padding:14px 6px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;
  color:var(--text-primary);font-weight:600;font-size:11.5px;}
.quick-action-btn:active{background:var(--bg-card-hover);}
.qa-icon{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;}
.qa-icon svg{width:19px;height:19px;stroke-width:1.8;}

/* ---------- TRANSACTIONS ---------- */
.tx-group-label{font-size:11px;font-weight:700;color:var(--text-muted);letter-spacing:.3px;
  padding:10px 2px 8px;}
.transaction-item{background:var(--bg-input);border-radius:16px;padding:12px 14px;border:1px solid var(--border);
  display:flex;align-items:center;gap:12px;cursor:pointer;margin-bottom:8px;}
.transaction-item:active{background:var(--bg-card-hover);}
.transaction-item:last-child{margin-bottom:0;}
.transaction-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.transaction-icon svg{width:18px;height:18px;fill:none;stroke-width:1.9;}
.transaction-details{flex:1;min-width:0;}
.transaction-title{font-size:13.5px;font-weight:600;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.transaction-sub{font-size:11px;color:var(--text-muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.transaction-right{text-align:right;flex-shrink:0;}
.transaction-amount{font-size:13.5px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums;}
.transaction-amount.positive{color:var(--success);}
.transaction-time{font-size:10.5px;color:var(--text-muted);margin-top:2px;}

/* ---------- PROFILE ---------- */
.profile-section{text-align:center;padding:6px 0;}
.avatar-lg-wrap{position:relative;width:76px;height:76px;margin:0 auto 14px;cursor:pointer;}
.profile-avatar-lg{width:76px;height:76px;border-radius:50%;background:var(--primary);
  background-image:url('https://picsum.photos/id/64/200/200');background-size:cover;background-position:center;
  border:3px solid var(--bg-body);box-shadow:0 0 0 2px var(--primary);}
.avatar-cam-badge{position:absolute;bottom:0;right:0;width:26px;height:26px;border-radius:50%;
  background:var(--primary);border:3px solid var(--bg-module);display:flex;align-items:center;justify-content:center;}
.avatar-cam-badge svg{width:12px;height:12px;stroke:#fff;fill:none;stroke-width:2.2;}
.profile-name{font-size:17px;font-weight:700;margin-bottom:3px;}
.profile-email{font-size:12px;color:var(--text-secondary);margin-bottom:16px;}
.profile-stats{display:flex;gap:10px;margin-top:14px;}
.stat-card{flex:1;background:var(--bg-input);border-radius:14px;padding:12px;border:1px solid var(--border);}
.stat-value{font-size:16px;font-weight:700;color:var(--primary);font-variant-numeric:tabular-nums;}
.stat-label{font-size:9px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin-top:3px;}
.profile-menu-btn{width:100%;padding:13px;border-radius:14px;border:1px solid var(--border);background:var(--bg-input);
  color:var(--text-primary);font-weight:600;cursor:pointer;display:flex;align-items:center;gap:10px;font-size:13px;}
.profile-menu-btn:active{background:var(--bg-card-hover);}
.profile-menu-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;}
.profile-menu-btn.danger{color:var(--danger);}

/* ---------- TABS / NAV ---------- */
.tab-content{display:none;}
.tab-content.active{display:flex;flex-direction:column;gap:16px;}
#tab-inicio.active{overflow-y:auto!important;max-height:none!important;padding-bottom:4px;}
#tab-historial.active{overflow-y:auto!important;height:100%;flex:1;min-height:0;background:transparent;gap:0;}
#tab-perfil.active{overflow-y:auto!important;}

.historial-rigid{background:linear-gradient(180deg,var(--bg-card) 0%, var(--bg-module) 100%);
  border-radius:22px 22px 0 0;padding:18px 16px 16px;box-shadow:var(--shadow);border:1px solid var(--border);
  border-bottom:none;flex:1;display:flex;flex-direction:column;min-height:0;}
.historial-header{padding-bottom:14px;border-bottom:1px solid var(--border);flex-shrink:0;
  display:flex;justify-content:space-between;align-items:center;}
.historial-header h2{font-size:17px;font-weight:700;}
.historial-list{flex:1;overflow-y:auto;padding-top:4px;}

.floating-nav{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);width:calc(100% - 32px);
  max-width:380px;background:var(--nav-bg);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-radius:22px;padding:9px 8px;display:flex;justify-content:space-around;align-items:center;
  box-shadow:var(--shadow-lg);z-index:1000;border:1px solid var(--nav-border);}
.floating-nav .nav-item{cursor:pointer;color:var(--text-muted);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;padding:7px 14px;border-radius:14px;position:relative;
  min-width:55px;background:none;border:none;font-size:10px;font-weight:600;}
.floating-nav .nav-item svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:2;}
.floating-nav .nav-item.active{color:var(--primary);background:rgba(92,97,105,.14);}

@media (max-width:480px){
  body{padding:12px;padding-bottom:85px;}
  .wallet-container{gap:13px;height:calc(100vh - 100px);}
  .debit-card{padding:19px 16px 17px;border-radius:20px;min-height:172px;}
  .balance-amount{font-size:25px;}
  .module-window{padding:15px 13px;border-radius:20px;}
  .floating-nav{bottom:10px;width:calc(100% - 24px);padding:7px 6px;border-radius:18px;}
}
</style>
</head>
<body data-theme="dark">
<div class="wallet-container">

  <!-- ============ INICIO ============ -->
  <div class="tab-content active" id="tab-inicio">

    <div class="header">
      <div class="header-left">
        <div class="avatar-wrap" onclick="openAvatarPicker()">
          <div class="profile-img" id="avatarSmall"></div>
          <div class="avatar-cam-dot">
            <svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
          </div>
        </div>
        <div>
          <div class="greeting-name" id="greetingName">Hola</div>
          <div class="greeting-sub">Bienvenido de vuelta</div>
        </div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" onclick="toggleTheme()" title="Cambiar tema">
          <svg id="theme-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
        </button>
        <button class="icon-btn" onclick="alert('Notificaciones')" title="Notificaciones">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Tarjeta de débito -->
    <div class="debit-card">
      <div class="card-row-top">
        <div class="card-chip"></div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;">
          <svg class="contactless" viewBox="0 0 24 24"><path d="M8 12a4 4 0 0 1 4-4"/><path d="M8 12a4 4 0 0 0 4 4"/><path d="M5 9a8 8 0 0 1 7-7"/><path d="M5 15a8 8 0 0 0 7 7"/></svg>
          <span class="card-issuer">RAYITO</span>
        </div>
      </div>
      <div class="card-row-mid">
        <div class="balance-label-row">
          <span class="balance-label">Saldo disponible</span>
          <span class="eye-toggle" onclick="toggleBalanceVisibility()" title="Mostrar/ocultar saldo">
            <svg id="eyeIcon" viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
          </span>
        </div>
        <div class="balance-amount" id="balanceAmount">Bs 0.00</div>
      </div>
      <div class="card-row-bottom" style="justify-content:flex-end;">
        <div class="brand-mark-inline"><div class="c1"></div><div class="c2"></div></div>
      </div>
    </div>

    <div class="module-window">
      <div class="buttons-row">
        <button class="btn btn-recharge" onclick="alert('Recargar saldo')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h7l-1 8 10-12h-7l1-8z"/></svg>
          Recargar
        </button>
        <button class="btn btn-pay" onclick="alert('Realizar pago')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
          Pagar
        </button>
      </div>
    </div>

    <div class="module-window">
      <h2 class="section-title">Acciones rápidas</h2>
      <div class="quick-actions-row">
        <div class="quick-action-btn" onclick="alert('Recargar Tigo')">
          <div class="qa-icon" style="background:rgba(92,97,105,.14);">
            <svg viewBox="0 0 24 24" fill="none" stroke="var(--primary)"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
          </div>
          <span>Tigo</span>
        </div>
        <div class="quick-action-btn" onclick="alert('Recargar Viva')">
          <div class="qa-icon" style="background:rgba(212,175,55,.14);">
            <svg viewBox="0 0 24 24" fill="none" stroke="var(--gold)"><path d="M5 12h14M12 5v14"/><circle cx="12" cy="12" r="9"/></svg>
          </div>
          <span>Viva</span>
        </div>
        <div class="quick-action-btn" onclick="alert('Recargar Entel')">
          <div class="qa-icon" style="background:rgba(22,163,74,.12);">
            <svg viewBox="0 0 24 24" fill="none" stroke="var(--success)"><rect x="3" y="6" width="18" height="12" rx="2" ry="2"/><path d="M3 10h18"/><circle cx="8" cy="14" r="1.5"/></svg>
          </div>
          <span>Entel</span>
        </div>
      </div>

      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
        <h2 class="section-title" style="margin-bottom:0;flex:1;">Actividad reciente</h2>
        <span class="link-small" onclick="switchTab('tab-historial', document.querySelectorAll('.nav-item')[1])">Ver todo</span>
      </div>
      <div id="recentTxList"></div>
    </div>
  </div>

  <!-- ============ HISTORIAL ============ -->
  <div class="tab-content" id="tab-historial">
    <div class="historial-rigid">
      <div class="historial-header"><h2>Todas las transacciones</h2></div>
      <div class="historial-list" id="fullTxList"></div>
    </div>
  </div>

  <!-- ============ PERFIL ============ -->
  <div class="tab-content" id="tab-perfil">
    <div class="module-window">
      <div class="profile-section">
        <div class="avatar-lg-wrap" onclick="openAvatarPicker()">
          <div class="profile-avatar-lg" id="avatarLarge"></div>
          <div class="avatar-cam-badge">
            <svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
          </div>
        </div>
        <div class="profile-name" id="profileName">Usuario</div>
        <div class="profile-email" id="profileEmail">email@example.com</div>
        <div class="profile-stats">
          <div class="stat-card"><div class="stat-value" id="statTransactions">0</div><div class="stat-label">Transacciones</div></div>
          <div class="stat-card"><div class="stat-value" id="statBalance">Bs 0</div><div class="stat-label">Saldo</div></div>
          <div class="stat-card"><div class="stat-value">★</div><div class="stat-label">Usuario</div></div>
        </div>
        <div style="margin-top:18px;display:flex;flex-direction:column;gap:8px;">
          <button class="profile-menu-btn">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
            Configuración
          </button>
          <button class="profile-menu-btn">
            <svg viewBox="0 0 24 24"><path d="M12 22s8-3 8-10V5l-8-3-8 3v7c0 7 8 10 8 10z"/></svg>
            Seguridad
          </button>
          <button class="profile-menu-btn danger" onclick="logout()">
            <svg viewBox="0 0 24 24"><path d="M16 17l5-5-5-5M21 12H9"/><path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h7"/></svg>
            Cerrar sesión
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<input type="file" id="avatarInput" accept="image/*" style="display:none">

<nav class="floating-nav" id="floatingNav">
  <button class="nav-item active" data-tab="tab-inicio" onclick="switchTab('tab-inicio', this)" title="Inicio">

    <span>Inicio</span>

    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
    <span>Historial</span>

    <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    <span>Perfil</span>
  </button>
</nav>

<script>
// ============ CONFIGURACIÓN SUPABASE ============
const supabaseUrl = 'https://zdrefbeqbqpvkrbexcva.supabase.co';
const supabaseKey = 'sb_publishable_fZgh-mQwxI-hnphiXRgHUA_ovOs_GF5';
window.supabase = supabase.createClient(supabaseUrl, supabaseKey);

// ============ ESTADO ============
let currentTheme = 'dark';
let balanceVisible = true;
let currentUser = null;
let userProfile = null;
let currentBalance = 0;
let allTransactions = [];

const ICONS = {
  recarga: `<path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.29 1.51 4.04 3 5.5l7 7z"/>`,
  entrada: `<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>`,
  salida: `<path d="M3 9v-4a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v4"/><polyline points="17 14 12 9 7 14"/><line x1="12" y1="9" x2="12" y2="21"/>`,
  servicio: `<rect x="4" y="3" width="16" height="18" rx="2"/><line x1="8" y1="8" x2="16" y2="8"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="8" y1="16" x2="12" y2="16"/>`
};

function formatCurrency(amount) {
  return 'Bs ' + parseFloat(amount).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}

function formatDate(dateString) {
  const date = new Date(dateString);
  const today = new Date();
  const yesterday = new Date(today);
  yesterday.setDate(yesterday.getDate() - 1);
  
  if (date.toDateString() === today.toDateString()) {
    return 'Hoy';
  } else if (date.toDateString() === yesterday.toDateString()) {
    return 'Ayer';
  } else {
    return date.toLocaleDateString('es-BO', { day: 'numeric', month: 'long' });
  }
}

function formatTime(dateString) {
  const date = new Date(dateString);
  return date.toLocaleTimeString('es-BO', { hour: '2-digit', minute: '2-digit' });
}

function getInitials(name) {
  if (!name) return 'U';
  const parts = name.split(' ');
  return parts[0].charAt(0).toUpperCase();
}

// ============ CARGA DE DATOS ============
async function loadUserProfile(userId) {
  try {
    const { data, error } = await window.supabase
      .from('user_profiles')
      .select('*')
      .eq('id', userId)
      .single();
    
    if (error && error.code !== 'PGRST116') {
      console.error('Error loading profile:', error);
      return null;
    }
    return data;
  } catch (error) {
    console.error('Error loading profile:', error);
    return null;
  }
}

async function calculateBalance(userId) {
  try {
    const { data, error } = await window.supabase
      .from('transactions')
      .select('amount, type')
      .eq('user_id', userId)
      .eq('status', 'completed');
    
    if (error) {
      console.error('Error calculating balance:', error);
      return 0;
    }
    
    let balance = 0;
    data.forEach(transaction => {
      if (transaction.type === 'deposit') {
        balance += parseFloat(transaction.amount);
      } else {
        balance -= parseFloat(transaction.amount);
      }
    });
    
    return balance;
  } catch (error) {
    console.error('Error calculating balance:', error);
    return 0;
  }
}

async function loadTransactions(userId) {
  try {
    const { data, error } = await window.supabase
      .from('transactions')
      .select('*')
      .eq('user_id', userId)
      .eq('status', 'completed')
      .order('created_at', { ascending: false });
    
    if (error) {
      console.error('Error loading transactions:', error);
      return [];
    }
    return data || [];
  } catch (error) {
    console.error('Error loading transactions:', error);
    return [];
  }
}

// ============ RENDERIZADO ============
function getTransactionIcon(type) {
  switch(type) {
    case 'deposit':
      return 'entrada';
    case 'withdrawal':
      return 'salida';
    case 'transfer':
      return 'salida';
    case 'recharge':
      return 'recarga';
    default:
      return 'servicio';
  }
}

function getTransactionColor(type, amount) {
  if (amount >= 0 || type === 'deposit') {
    return 'var(--success)';
  }
  switch(type) {
    case 'recharge':
      return 'var(--primary)';
    case 'transfer':
      return 'var(--danger)';
    case 'withdrawal':
      return 'var(--danger)';
    default:
      return 'var(--gold)';
  }
}

function getTransactionTitle(type, description) {
  if (description) return description;
  switch(type) {
    case 'deposit':
      return 'Depósito';
    case 'withdrawal':
      return 'Retiro';
    case 'transfer':
      return 'Transferencia';
    case 'recharge':
      return 'Recarga';
    default:
      return 'Transacción';
  }
}

function renderTxItem(tx) {
  const amount = parseFloat(tx.amount);
  const isDeposit = tx.type === 'deposit';
  const displayAmount = isDeposit ? amount : -amount;
  const positive = displayAmount >= 0;
  const icon = getTransactionIcon(tx.type);
  const color = getTransactionColor(tx.type, displayAmount);
  const title = getTransactionTitle(tx.type, tx.description);
  const time = formatTime(tx.created_at);
  
  return `
    <div class="transaction-item" onclick="alert('Detalle: ${title}')">
      <div class="transaction-icon" style="background:${color}14;">
        <svg viewBox="0 0 24 24" stroke="${color}">${ICONS[icon]}</svg>
      </div>
      <div class="transaction-details">
        <div class="transaction-title">${title}</div>
        <div class="transaction-sub">${tx.description || tx.type}</div>
      </div>
      <div class="transaction-right">
        <div class="transaction-amount ${positive ? 'positive' : ''}">${positive ? '+' : '-'} Bs ${Math.abs(displayAmount).toFixed(2)}</div>
        <div class="transaction-time">${time}</div>
      </div>
    </div>`;
}

function renderRecent() {
  const el = document.getElementById('recentTxList');
  const recent = allTransactions.slice(0, 3);
  
  if (recent.length === 0) {
    el.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-muted);">No hay transacciones</div>';
    return;
  }
  
  el.innerHTML = recent.map(renderTxItem).join('');
}

function renderFullHistory() {
  const el = document.getElementById('fullTxList');
  
  if (allTransactions.length === 0) {
    el.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-muted);">No hay transacciones registradas</div>';
    return;
  }
  
  let html = '';
  let lastGroup = null;
  
  allTransactions.forEach(tx => {
    const group = formatDate(tx.created_at);
    if (group !== lastGroup) {
      html += `<div class="tx-group-label">${group}</div>`;
      lastGroup = group;
    }
    html += renderTxItem(tx);
  });
  
  el.innerHTML = html;
}

async function updateUI() {
  if (!currentUser) return;
  
  // Update balance
  currentBalance = await calculateBalance(currentUser.id);
  document.getElementById('balanceAmount').textContent = formatCurrency(currentBalance);
  
  // Update stats
  document.getElementById('statBalance').textContent = formatCurrency(currentBalance);
  document.getElementById('statTransactions').textContent = allTransactions.length;
  
  // Update profile
  if (userProfile) {
    const displayName = userProfile.full_name || currentUser.email.split('@')[0];
    document.getElementById('greetingName').textContent = 'Hola, ' + displayName;
    document.getElementById('profileName').textContent = displayName;
    document.getElementById('profileEmail').textContent = currentUser.email;
    
    if (userProfile.avatar_url) {
      document.getElementById('avatarSmall').style.backgroundImage = `url('${userProfile.avatar_url}')`;
      document.getElementById('avatarLarge').style.backgroundImage = `url('${userProfile.avatar_url}')`;
    } else {
      const initial = getInitials(displayName);
      // Aquí podrías mostrar la inicial si quieres
    }
  }
  
  // Render transactions
  renderRecent();
  renderFullHistory();
}

// ============ TEMA ============
function applyTheme(theme) {
  document.body.setAttribute('data-theme', theme);
  document.getElementById('theme-color').setAttribute('content', theme === 'dark' ? '#080B14' : '#EEF1F8');
  const icon = document.getElementById('theme-icon');
  icon.innerHTML = theme === 'dark'
    ? `<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>`
    : `<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>`;
}

function toggleTheme() {
  currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
  applyTheme(currentTheme);
}

// ============ SALDO ============
function toggleBalanceVisibility() {
  balanceVisible = !balanceVisible;
  document.getElementById('balanceAmount').textContent = balanceVisible ? formatCurrency(currentBalance) : '••••••';
  const eye = document.getElementById('eyeIcon');
  eye.innerHTML = balanceVisible
    ? `<path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/>`
    : `<path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a21.6 21.6 0 0 1 5.06-6.06M9.9 4.24A10.4 10.4 0 0 1 12 4c7 0 11 7 11 7a21.6 21.6 0 0 1-2.16 3.19M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>`;
}

// ============ AVATAR ============
function openAvatarPicker() {
  document.getElementById('avatarInput').click();
}

document.getElementById('avatarInput').addEventListener('change', async function(e) {
  const file = e.target.files && e.target.files[0];
  if (!file || !currentUser) return;
  
  const reader = new FileReader();
  reader.onload = async function(ev) {
    const avatarDataUrl = ev.target.result;
    document.getElementById('avatarSmall').style.backgroundImage = `url('${avatarDataUrl}')`;
    document.getElementById('avatarLarge').style.backgroundImage = `url('${avatarDataUrl}')`;
    
    // Upload to Supabase Storage (opcional - puedes omitir si no tienes bucket)
    try {
      const fileExt = file.name.split('.').pop();
      const fileName = `${currentUser.id}.${fileExt}`;
      const filePath = `avatars/${fileName}`;
      
      const { error: uploadError } = await window.supabase.storage
        .from('avatars')
        .upload(filePath, file, { cacheControl: '3600', upsert: true });
      
      if (uploadError) throw uploadError;
      
      const { data: { publicUrl } } = window.supabase.storage
        .from('avatars')
        .getPublicUrl(filePath);
      
      const { error: updateError } = await window.supabase
        .from('user_profiles')
        .update({ avatar_url: publicUrl })
        .eq('id', currentUser.id);
      
      if (updateError) throw updateError;
      
      userProfile.avatar_url = publicUrl;
      console.log('Avatar subido correctamente');
    } catch (error) {
      console.error('Error subiendo avatar:', error);
    }
  };
  reader.readAsDataURL(file);
});

// ============ NAVEGACIÓN ============
function switchTab(tabId, btnElement) {
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  const selected = document.getElementById(tabId);
  if (selected) selected.classList.add('active');
  
  document.querySelectorAll('.floating-nav .nav-item').forEach(i => i.classList.remove('active'));
  if (btnElement) btnElement.classList.add('active');
  
  // Refresh data when switching to historial
  if (tabId === 'tab-historial') {
    renderFullHistory();
  }
}

// ============ LOGOUT ============
async function logout() {
  try {
    const { error } = await window.supabase.auth.signOut();
    if (error) throw error;
    window.location.href = 'index.html';
  } catch (error) {
    console.error('Error al cerrar sesión:', error);
  }
}

// ============ INIT ============
document.addEventListener('DOMContentLoaded', async function() {
  try {
    // Verificar sesión
    const { data: { session }, error: sessionError } = await window.supabase.auth.getSession();
    
    if (sessionError || !session) {
      // No hay sesión activa, redirigir al login
      window.location.href = 'index.html';
      return;
    }
    
    currentUser = session.user;
    
    // Cargar perfil del usuario
    userProfile = await loadUserProfile(currentUser.id);
    
    // Si no existe el perfil, redirigir al login
    if (!userProfile) {
      console.error('Perfil no encontrado');
      await window.supabase.auth.signOut();
      window.location.href = 'index.html';
      return;
    }
    
    // Cargar transacciones
    allTransactions = await loadTransactions(currentUser.id);
    
    // Actualizar UI
    await updateUI();
    
    applyTheme(currentTheme);
    
  } catch (error) {
    console.error('Error de inicialización:', error);
    window.location.href = 'index.html';
  }
});
</script>
</body>
</html>
