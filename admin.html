<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel | Sistema de Gestión</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0b0b12; }
  body { display: flex; align-items: stretch; justify-content: stretch; }
  .app { width: 100vw; height: 100vh; display: flex; overflow: hidden; background: #0b0b12; }

  /* SIDEBAR */
  .sidebar { width: 260px; background: #0f0f1a; display: flex; flex-direction: column; flex-shrink: 0; transition: width 0.2s ease; overflow: hidden; }
  .sidebar.collapsed { width: 72px; }
  .sidebar-brand { padding: 20px 22px; display: flex; align-items: center; gap: 12px; color: #f0f0f5; font-weight: 700; font-size: 17px; white-space: nowrap; flex-shrink: 0; }
  .sidebar-brand i { color: #3b82f6; font-size: 24px; min-width: 28px; text-align: center; }
  .sidebar-brand span.accent { color: #3b82f6; }
  .sidebar-nav { flex: 1; display: flex; flex-direction: column; gap: 2px; padding: 8px 10px; overflow-y: auto; overflow-x: hidden; }
  .nav-section { padding: 14px 14px 6px; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.6px; color: #4a4a60; font-weight: 700; white-space: nowrap; }
  .sidebar.collapsed .nav-section { display: none; }
  .nav-item { display: flex; align-items: center; gap: 14px; padding: 11px 14px; border-radius: 10px; color: #9a9ab0; font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.15s; border: none; background: transparent; text-align: left; width: 100%; white-space: nowrap; overflow: hidden; }
  .nav-item i { font-size: 17px; min-width: 22px; text-align: center; color: #6a6a85; }
  .nav-item:hover { background: #1a1a2a; color: #d0d0e0; }
  .nav-item.active { background: #1e1e30; color: #fff; }
  .nav-item.active i { color: #3b82f6; }
  .sidebar.collapsed .nav-item span, .sidebar.collapsed .sidebar-brand span { display: none; }
  .sidebar.collapsed .nav-item { justify-content: center; padding: 11px 0; }
  .sidebar-footer { padding: 16px 18px; border-top: 1px solid #1d1d2b; display: flex; align-items: center; gap: 12px; color: #6a6a85; font-size: 13px; white-space: nowrap; flex-shrink: 0; }
  .sidebar-footer .avatar { width: 34px; height: 34px; border-radius: 50%; background: #2a2a3a; display: flex; align-items: center; justify-content: center; color: #3b82f6; font-weight: 700; flex-shrink: 0; }
  .sidebar.collapsed .sidebar-footer span { display: none; }
  .sidebar.collapsed .sidebar-footer { justify-content: center; }

  /* MAIN */
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: #0b0b12; }
  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 14px 26px; background: #0f0f1a; flex-shrink: 0; }
  .topbar-left { display: flex; align-items: center; gap: 16px; }
  .toggle-btn { background: transparent; border: none; color: #8a8aa0; font-size: 18px; cursor: pointer; padding: 6px 8px; border-radius: 8px; }
  .toggle-btn:hover { background: #1a1a2a; color: #fff; }
  .topbar h1 { color: #e8e8f0; font-size: 18px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
  .topbar h1 i { color: #3b82f6; font-size: 20px; }
  .topbar-right .badge { background: #1a1a2a; color: #8a8aa0; padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
  .content { flex: 1; overflow-y: auto; padding: 24px 28px 40px; }

  /* TOOLBAR (chips) */
  .toolbar { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 20px; padding: 10px 14px; background: #10101c; border-radius: 12px; }
  .toolbar-button { background: transparent; border: none; color: #8a8aa0; padding: 8px 14px; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: all 0.15s; white-space: nowrap; }
  .toolbar-button i { font-size: 13px; }
  .toolbar-button:hover { background: #1a1a2a; color: #d0d0e0; }
  .toolbar-button.active { background: #1e2a4a; color: #fff; }
  .toolbar-button.active i { color: #3b82f6; }
  .toolbar-separator { width: 1px; height: 22px; background: #232334; margin: 0 8px; align-self: center; }

  /* PAGE HEADER */
  .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
  .page-header h2 { color: #f0f0f5; font-size: 22px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
  .page-header h2 i { color: #3b82f6; }
  .header-actions { display: flex; gap: 10px; flex-wrap: wrap; }

  /* BUTTONS */
  .btn { background: #1a1a2a; border: none; color: #d0d0e0; padding: 9px 18px; border-radius: 10px; font-size: 13px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: all 0.15s; white-space: nowrap; }
  .btn:hover { background: #252538; color: #fff; }
  .btn-primary { background: #3b82f6; color: #fff; }
  .btn-primary:hover { background: #2563eb; }
  .btn-success { background: #16a34a; color: #fff; }
  .btn-success:hover { background: #15803d; }
  .btn-danger { background: #dc2626; color: #fff; }
  .btn-danger:hover { background: #b91c1c; }
  .btn-sm { padding: 6px 10px; font-size: 12px; border-radius: 8px; }

  /* STATS */
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 24px; }
  .stat-card { background: #13131f; border-radius: 14px; padding: 18px 20px; display: flex; flex-direction: column; gap: 4px; }
  .stat-card .label { color: #8a8aa0; font-size: 12px; font-weight: 500; text-transform: uppercase; }
  .stat-card .value { color: #fff; font-size: 28px; font-weight: 700; }
  .stat-card .icon-wrap { display: flex; justify-content: space-between; align-items: center; }
  .stat-card .icon-wrap i { font-size: 22px; opacity: 0.85; }

  /* PANEL */
  .panel { background: #13131f; border-radius: 14px; overflow: hidden; margin-bottom: 20px; }
  .panel-header { padding: 16px 22px; border-bottom: 1px solid #1d1d2b; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
  .panel-title { color: #f0f0f5; font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
  .panel-title i { color: #3b82f6; }
  .panel-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .panel-body { padding: 20px 22px; }

  /* SEARCH */
  .search-input { background: #0f0f1a; border: 1px solid #232334; color: #e0e0f0; padding: 9px 14px; border-radius: 10px; font-size: 13px; outline: none; min-width: 220px; font-family: inherit; }
  .search-input:focus { border-color: #3b82f6; }

  /* TABLE */
  .table-wrap { background: #13131f; border-radius: 14px; overflow: hidden; }
  .table-scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; min-width: 700px; }
  th { text-align: left; padding: 13px 18px; color: #8a8aa0; font-weight: 600; font-size: 11.5px; text-transform: uppercase; background: #10101c; white-space: nowrap; letter-spacing: 0.4px; }
  td { padding: 12px 18px; color: #c0c0d0; white-space: nowrap; vertical-align: middle; }
  tr:hover td { background: #16162a; }
  .tag { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11.5px; font-weight: 500; background: #1e1e30; color: #b0b0c8; }
  .tag.activo { background: #14331f; color: #4ade80; }
  .tag.inactivo { background: #3a1a1a; color: #f87171; }
  .tag.info { background: #1a2a4a; color: #60a5fa; }
  .tag.warn { background: #3a2a1a; color: #fbbf24; }
  .tag.pending { background: #3a2a1a; color: #fbbf24; }
  .tag.completed { background: #14331f; color: #4ade80; }
  .tag.failed { background: #3a1a1a; color: #f87171; }
  .actions-cell { display: flex; gap: 6px; }
  .empty-state { padding: 40px 20px; text-align: center; color: #6a6a85; font-size: 14px; }
  .loading { display: flex; align-items: center; justify-content: center; padding: 60px; color: #8a8aa0; gap: 12px; font-size: 14px; }
  .loading i { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* MODAL */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.75); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px; backdrop-filter: blur(6px); }
  .modal-overlay.show, .modal-overlay.active { display: flex; }
  .modal { background: #13131f; border-radius: 16px; width: 100%; max-width: 640px; max-height: 92vh; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7); }
  .modal.modal-wide { max-width: 950px; }
  .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 18px 24px; border-bottom: 1px solid #1d1d2b; flex-shrink: 0; }
  .modal-header h3, .modal-title { color: #f0f0f5; font-size: 17px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
  .modal-header h3 i { color: #3b82f6; }
  .modal-close { background: transparent; border: none; color: #8a8aa0; font-size: 20px; cursor: pointer; padding: 4px 10px; border-radius: 8px; }
  .modal-close:hover { background: #1a1a2a; color: #fff; }
  .modal-body { padding: 20px 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
  .modal-footer { display: flex; justify-content: flex-end; gap: 10px; padding: 16px 24px; border-top: 1px solid #1d1d2b; flex-shrink: 0; }
  .fields-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .fields-grid .field-full { grid-column: 1 / -1; }
  .field, .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 4px; }
  .field label, .form-label { color: #9a9ab0; font-size: 12.5px; font-weight: 500; text-transform: capitalize; }
  .field input, .field select, .field textarea,
  .form-input, .form-select { background: #0f0f1a; border: 1px solid #232334; border-radius: 10px; padding: 10px 14px; color: #e0e0f0; font-size: 13.5px; outline: none; font-family: inherit; width: 100%; }
  .field input:focus, .field select:focus, .field textarea:focus,
  .form-input:focus, .form-select:focus { border-color: #3b82f6; }
  .field textarea, textarea.form-input { resize: vertical; min-height: 70px; }
  .field-checkbox { flex-direction: row; align-items: center; gap: 10px; }
  .field-checkbox input { width: auto; accent-color: #3b82f6; }
  .field input[readonly] { opacity: 0.85; cursor: not-allowed; background: #0a0a14; }

  /* TOAST */
  .toast-container { position: fixed; bottom: 24px; right: 24px; z-index: 2000; display: flex; flex-direction: column; gap: 10px; }
  .toast { background: #1a1a2a; color: #e0e0f0; padding: 12px 20px; border-radius: 12px; font-size: 13.5px; display: flex; align-items: center; gap: 10px; box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5); animation: slideIn 0.25s ease; min-width: 260px; }
  .toast.success, .toast-success { border-left: 3px solid #4ade80; }
  .toast.error, .toast-error { border-left: 3px solid #f87171; }
  .toast.info, .toast-info { border-left: 3px solid #60a5fa; }
  @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #2a2a3a; border-radius: 10px; }
  ::-webkit-scrollbar-thumb:hover { background: #3a3a4a; }

  @media (max-width: 800px) {
    .sidebar { width: 72px; }
    .sidebar .nav-item span, .sidebar .sidebar-brand span, .sidebar-footer span, .nav-section { display: none; }
    .sidebar .nav-item { justify-content: center; padding: 11px 0; }
    .sidebar-footer { justify-content: center; }
    .content { padding: 16px; }
    .topbar { padding: 12px 16px; }
    .page-header h2 { font-size: 18px; }
    .fields-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <i class="fas fa-shield-halved"></i>
      <span>Rayito<span class="accent"> Admin</span></span>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section">Principal</div>
      <button class="nav-item active" data-view="dashboard" onclick="switchView('dashboard')"><i class="fas fa-chart-pie"></i><span>Dashboard</span></button>
      <button class="nav-item" data-view="users" onclick="switchView('users')"><i class="fas fa-users"></i><span>Usuarios</span></button>
      <button class="nav-item" data-view="transactions" onclick="switchView('transactions')"><i class="fas fa-money-bill-wave"></i><span>Transacciones</span></button>
      <button class="nav-item" data-view="transfer" onclick="switchView('transfer')"><i class="fas fa-paper-plane"></i><span>Transferir</span></button>
      <div class="nav-section">Móvil</div>
      <button class="nav-item" data-view="operators" onclick="switchView('operators')"><i class="fas fa-tower-broadcast"></i><span>Operadores</span></button>
      <button class="nav-item" data-view="rechargeTypes" onclick="switchView('rechargeTypes')"><i class="fas fa-bolt"></i><span>Tipos de Recarga</span></button>

    </nav>
    <div class="sidebar-footer">
      <div class="avatar">A</div>
      <span>Administrador</span>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="topbar-left">
        <button class="toggle-btn" id="toggleSidebar"><i class="fas fa-bars"></i></button>
        <h1><i class="fas fa-shield-halved"></i> <span id="pageTitle">Panel de Administración</span></h1>
      </div>
      <div class="topbar-right">
        <span class="badge" id="connStatus"><i class="fas fa-circle" style="color:#4ade80;font-size:8px;"></i>Conectando...</span>

</div>

<!-- MODAL CRUD -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalBox">
    <div class="modal-header">
      <h3 id="modalTitle"><i class="fas fa-plus"></i> Nuevo registro</h3>
      <button class="modal-close" id="modalClose"><i class="fas fa-times"></i></button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer">
      <button class="btn" id="modalCancel">Cancelar</button>
      <button class="btn btn-primary" id="modalSave"><i class="fas fa-save"></i> Guardar</button>
    </div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script>
// =============================================
// SUPABASE
// =============================================
const SUPABASE_URL = 'https://zdrefbeqbqpvkrbexcva.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_fZgh-mQwxI-hnphiXRgHUA_ovOs_GF5';
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false }
});

// =============================================
// ESQUEMAS DE TABLAS
// =============================================
const SCHEMA = {
  operators: {
    table: 'mobile_operators',
    label: 'Operadores Móviles',
    singular: 'Operador',
    icon: 'fa-tower-broadcast',
    pk: 'id',
    order: { column: 'display_order', ascending: true },
    columns: [
      { key: 'id', label: 'ID', type: 'readonly' },
      { key: 'name', label: 'Nombre', type: 'text', required: true },
      { key: 'code', label: 'Código', type: 'text', required: true },
      { key: 'logo_url', label: 'Logo URL', type: 'text', full: true },
      { key: 'display_order', label: 'Orden', type: 'number' },
      { key: 'is_active', label: 'Activo', type: 'boolean' },
    ],
    listFields: ['name', 'code', 'logo_url', 'display_order', 'is_active'],
  },
  rechargeTypes: {
    table: 'recharge_types',
    label: 'Tipos de Recarga',
    singular: 'Tipo de Recarga',
    icon: 'fa-bolt',
    pk: 'id',
    order: { column: 'display_order', ascending: true },
    joinSelect: '*, mobile_operators(name)',
    fkCache: { operator_id: 'operators' },
    columns: [
      { key: 'id', label: 'ID', type: 'readonly' },
      { key: 'operator_id', label: 'Operador', type: 'select-fk', fk: 'operators', required: true },
      { key: 'name', label: 'Nombre', type: 'text', required: true },
      { key: 'code', label: 'Código', type: 'text', required: true },
      { key: 'display_order', label: 'Orden', type: 'number' },
      { key: 'is_active', label: 'Activo', type: 'boolean' },
    ],
    listFields: ['name', 'code', 'operator_id', 'display_order', 'is_active'],
  },
  packages: {
    table: 'mobile_packages',
    label: 'Paquetes Móviles',
    singular: 'Paquete',
    icon: 'fa-box-open',
    pk: 'id',
    order: { column: 'created_at', ascending: false },
    joinSelect: '*, mobile_operators(name), recharge_types(name)',
    fkCache: { operator_id: 'operators', recharge_type_id: 'rechargeTypes' },
    columns: [
      { key: 'id', label: 'ID', type: 'readonly' },
      { key: 'operator_id', label: 'Operador', type: 'select-fk', fk: 'operators', required: true },
      { key: 'recharge_type_id', label: 'Tipo de Recarga', type: 'select-fk', fk: 'rechargeTypes', required: true },
      { key: 'name', label: 'Nombre', type: 'text', required: true },
      { key: 'description', label: 'Descripción', type: 'textarea', full: true },
      { key: 'price', label: 'Precio (Bs)', type: 'number', step: '0.01', required: true },
      { key: 'is_active', label: 'Activo', type: 'boolean' },
    ],
    listFields: ['name', 'operator_id', 'recharge_type_id', 'price', 'description', 'is_active'],
  },
  users: {
    table: 'user_profiles',
    label: 'Usuarios',
    singular: 'Usuario',
    icon: 'fa-users',
    pk: 'id',
    order: { column: 'created_at', ascending: false },
    columns: [
      { key: 'id', label: 'ID', type: 'readonly' },
      { key: 'full_name', label: 'Nombre completo', type: 'text', required: true },
      { key: 'email', label: 'Email', type: 'email', required: true },
      { key: 'phone', label: 'Teléfono', type: 'text' },
      { key: 'balance', label: 'Saldo (Bs)', type: 'balance', readonly: true },
      { key: 'avatar_url', label: 'Avatar URL', type: 'text', full: true },
    ],
    listFields: ['id', 'full_name', 'email', 'phone', 'balance', 'created_at'],
  },
  transactions: {
    table: 'transactions',
    label: 'Transacciones',
    singular: 'Transacción',
    icon: 'fa-money-bill-wave',
    pk: 'id',
    order: { column: 'created_at', ascending: false },
    columns: [
      { key: 'id', label: 'ID', type: 'readonly' },
      { key: 'user_id', label: 'ID Usuario', type: 'text', readonly: true },
      { key: 'amount', label: 'Monto (Bs)', type: 'number', step: '0.01', required: true },
      { key: 'type', label: 'Tipo', type: 'select', options: ['deposit','withdrawal','transfer','recharge'] },
      { key: 'status', label: 'Estado', type: 'select', options: ['pending','completed','failed'] },
      { key: 'description', label: 'Descripción', type: 'textarea', full: true },
    ],
    listFields: ['id', 'user_id', 'amount', 'type', 'status', 'description', 'created_at'],
  },
};

// =============================================
// ESTADO
// =============================================
let currentSection = 'dashboard';
let currentData = [];
let editingId = null;
let currentTableKey = null;
let cache = { operators: [], rechargeTypes: [], packages: [], users: [], transactions: [], userBalances: {} };

const $ = (s) => document.querySelector(s);
const content = $('#contentArea');
const modalOverlay = $('#modalOverlay');
const modalTitle = $('#modalTitle');
const modalBody = $('#modalBody');
const modalSave = $('#modalSave');
const modalClose = $('#modalClose');
const modalCancel = $('#modalCancel');

// =============================================
// UTILIDADES
// =============================================
function toast(msg, type = 'info') {
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  const icons = { success: 'fa-check-circle', error: 'fa-exclamation-circle', info: 'fa-info-circle' };
  t.innerHTML = `<i class="fas ${icons[type] || icons.info}"></i> ${msg}`;
  $('#toastContainer').appendChild(t);
  setTimeout(() => t.remove(), 3500);
}

function formatDate(d) {
  if (!d) return '—';
  try {
    return new Date(d).toLocaleDateString('es-BO', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
  } catch { return d; }
}

function formatBs(amount) {
  return 'Bs ' + parseFloat(amount || 0).toFixed(2);
}

function escapeHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function getFkName(cacheKey, id) {
  const item = cache[cacheKey]?.find(x => x.id === id);
  return item ? item.name : '—';
}

// =============================================
// NAVEGACIÓN
// =============================================
document.querySelectorAll('.nav-item').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentSection = btn.dataset.view;
    switchView(currentSection);
  });
});

$('#toggleSidebar').addEventListener('click', () => {
  $('#sidebar').classList.toggle('collapsed');
});

function switchView(viewName) {
  // sincronizar sidebar
  document.querySelectorAll('.nav-item').forEach(item => {
    item.classList.toggle('active', item.dataset.view === viewName);
  });
  currentSection = viewName;
  const titles = {
    dashboard: 'Dashboard',
    users: 'Usuarios',
    transactions: 'Transacciones',
    transfer: 'Transferir Fondos',
    operators: 'Operadores Móviles',
    rechargeTypes: 'Tipos de Recarga',
    packages: 'Paquetes Móviles',
  };
  $('#pageTitle').textContent = titles[viewName] || 'Panel';
  renderSection(viewName);
}

// =============================================
// CARGA DE DATOS
// =============================================
async function fetchAllRecords(table, select = '*', filters = []) {
  const pageSize = 1000;
  const records = [];

  for (let offset = 0; ; offset += pageSize) {
    let query = db.from(table).select(select).range(offset, offset + pageSize - 1);
    for (const filter of filters) {
      if (!filter || typeof query[filter.method] !== 'function') continue;
      query = query[filter.method](...(filter.args || []));
    }

    const { data, error } = await query;
    if (error) throw error;
    records.push(...(data || []));
    if (!data || data.length < pageSize) return records;
  }
}

async function calculateUserBalances() {
  try {
    const [users, transactions] = await Promise.all([
      fetchAllRecords('user_profiles', 'id'),
      fetchAllRecords('transactions', 'user_id, type, amount, status, metadata'),
    ]);
    const balances = Object.fromEntries((users || []).map(user => [user.id, 0]));

    for (const transaction of transactions || []) {
      if (transaction.status !== 'completed') continue;
      const amount = Number(transaction.amount);
      if (!Number.isFinite(amount)) continue;

      if (transaction.type === 'deposit') {
        if (transaction.user_id in balances) balances[transaction.user_id] += amount;
      } else if (transaction.type === 'withdrawal') {
        if (transaction.user_id in balances) balances[transaction.user_id] -= amount;
      } else if (transaction.type === 'transfer') {
        if (transaction.user_id in balances) balances[transaction.user_id] -= amount;
        const recipientId = transaction.metadata?.to_user_id;
        if (recipientId && recipientId in balances) balances[recipientId] += amount;
      }
    }

    return balances;
  } catch (err) {
    console.error('Error al calcular saldos:', err);
    return {};
  }
}

async function loadAllData() {
  try {
    const [ops, rts, pkgs, users, txs] = await Promise.all([
      db.from('mobile_operators').select('*').order('display_order', { ascending: true }),
      db.from('recharge_types').select('*, mobile_operators(name)').order('display_order', { ascending: true }),
      db.from('mobile_packages').select('*, mobile_operators(name), recharge_types(name)').order('created_at', { ascending: false }),
      db.from('user_profiles').select('*').order('created_at', { ascending: false }),
      fetchAllRecords('transactions', '*', [
        { method: 'order', args: ['created_at', { ascending: false }] },
      ]),
    ]);
    if (ops.error) throw ops.error;
    if (rts.error) throw rts.error;
    if (pkgs.error) throw pkgs.error;
    if (users.error) throw users.error;
    if (txs.error) throw txs.error;

    cache.operators = ops.data || [];
    cache.rechargeTypes = rts.data || [];
    cache.packages = pkgs.data || [];
    cache.users = users.data || [];
    cache.transactions = txs || [];
    cache.userBalances = await calculateUserBalances();

    $('#connStatus').innerHTML = '<i class="fas fa-circle" style="color:#4ade80;font-size:8px;"></i>Conectado';
  } catch (err) {
    console.error(err);
    $('#connStatus').innerHTML = '<i class="fas fa-circle" style="color:#f87171;font-size:8px;"></i>Error';
    toast('Error al cargar datos: ' + err.message, 'error');
  }
}

async function refreshAll() {
  toast('Actualizando datos...', 'info');
  await loadAllData();
  renderSection(currentSection);
}

// =============================================
// RENDER PRINCIPAL
// =============================================
async function renderSection(view) {
  content.innerHTML = `<div class="loading"><i class="fas fa-spinner"></i> Cargando...</div>`;
  if (view === 'dashboard') return renderDashboard();
  if (view === 'transfer') return renderTransfer();
  if (SCHEMA[view]) return renderTable(view);
  content.innerHTML = `<div class="empty-state">Sección no encontrada</div>`;
}

// =============================================
// DASHBOARD
// =============================================

    { label: 'Operadores', value: cache.operators.length, icon: 'fa-tower-broadcast', color: '#fbbf24' },
    { label: 'Paquetes', value: cache.packages.length, icon: 'fa-box-open', color: '#a78bfa' },
    { label: 'Volumen Total', value: formatBs(totalVolume), icon: 'fa-coins', color: '#60a5fa' },
  ];

  content.innerHTML = `
    <div class="stats-grid">
      ${cards.map(c => `
        <div class="stat-card">
          <div class="icon-wrap">
            <span class="label">${c.label}</span>
            <i class="fas ${c.icon}" style="color:${c.color}"></i>
          </div>
          <span class="value">${c.value}</span>
        </div>
      `).join('')}

    <div class="table-wrap">
      <div class="panel-header" style="background:#10101c;border-bottom:1px solid #1d1d2b;">
        <div class="panel-title"><i class="fas fa-clock-rotate-left"></i> Actividad Reciente</div>
        <button class="btn btn-sm" onclick="refreshAll()"><i class="fas fa-sync"></i> Actualizar</button>
      </div>
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>Fecha</th>
              <th>Usuario</th>
              <th>Tipo</th>
              <th>Monto</th>
              <th>Estado</th>
            </tr>
          </thead>

              <tr>
                <td>${formatDate(t.created_at)}</td>

                <td><span class="tag info">${escapeHtml(t.type || '—')}</span></td>
                <td><strong style="color:#fff;">${formatBs(t.amount)}</strong></td>

// =============================================
// RENDER TABLA CRUD
// =============================================
function renderTable(tableKey) {
  const schema = SCHEMA[tableKey];
  currentTableKey = tableKey;
  currentData = cache[tableKey] || [];

  content.innerHTML = `
    <div class="page-header">
      <h2><i class="fas ${schema.icon}"></i> ${schema.label}</h2>
      <div class="header-actions">
        <input type="text" class="search-input" id="searchBox" placeholder="Buscar...">
        <button class="btn btn-primary" id="btnNew"><i class="fas fa-plus"></i> Nuevo</button>
        <button class="btn" id="btnRefresh"><i class="fas fa-sync"></i> Refrescar</button>
      </div>
    </div>
    <div class="table-wrap">
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              ${schema.listFields.map(f => `<th>${schema.columns.find(c => c.key === f)?.label || f}</th>`).join('')}
              <th style="text-align:right;">Acciones</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            ${renderRows(tableKey, currentData)}
          </tbody>
        </table>
      </div>
    </div>
  `;

  $('#btnNew').onclick = () => openModal(tableKey, null);
  $('#btnRefresh').onclick = async () => { await loadAllData(); renderTable(tableKey); };
  $('#searchBox').oninput = (e) => {
    const term = e.target.value.toLowerCase();
    const filtered = currentData.filter(row =>
      schema.listFields.some(f => String(row[f] ?? '').toLowerCase().includes(term))
    );
    $('#tableBody').innerHTML = renderRows(tableKey, filtered);
    bindRowActions(tableKey);
  };
  bindRowActions(tableKey);
}

function renderRows(tableKey, rows) {
  const schema = SCHEMA[tableKey];
  if (!rows.length) return `<tr><td colspan="${schema.listFields.length + 1}" class="empty-state">No hay registros</td></tr>`;
  return rows.map(row => `
    <tr>
      ${schema.listFields.map(f => `<td>${renderCell(row, f, schema)}</td>`).join('')}
      <td>
        <div class="actions-cell" style="justify-content:flex-end;">
          ${tableKey === 'users' ? `<button class="btn btn-sm" data-clear-history="${row[schema.pk]}" title="Borrar historial y conservar saldo"><i class="fas fa-eraser"></i></button>` : ''}
          <button class="btn btn-sm" data-edit="${row[schema.pk]}" title="Editar"><i class="fas fa-pen"></i></button>
          <button class="btn btn-sm btn-danger" data-del="${row[schema.pk]}" title="Eliminar"><i class="fas fa-trash"></i></button>
        </div>
      </td>
    </tr>
  `).join('');
}

function bindRowActions(tableKey) {
  const schema = SCHEMA[tableKey];
  document.querySelectorAll('[data-edit]').forEach(b => {
    b.onclick = () => {
      const row = currentData.find(r => String(r[schema.pk]) === b.dataset.edit);
      openModal(tableKey, row);
    };
  });
  document.querySelectorAll('[data-del]').forEach(b => {
    b.onclick = () => deleteRecord(tableKey, b.dataset.del);
  });
  document.querySelectorAll('[data-clear-history]').forEach(b => {
    b.onclick = () => clearUserTransactionHistory(b.dataset.clearHistory);
  });
}

function renderCell(row, fieldKey, schema) {
  const col = schema.columns.find(c => c.key === fieldKey);
  let value = fieldKey === 'balance' ? (cache.userBalances[row.id] ?? 0) : row[fieldKey];

  // FK display
  if (col?.type === 'select-fk') {
    const cacheKey = col.fk;
    return escapeHtml(getFkName(cacheKey, value));
  }

  if (value === null || value === undefined || value === '') return '—';

  if (col?.type === 'boolean') return value
    ? '<span class="tag activo">Sí</span>'
    : '<span class="tag inactivo">No</span>';

  if (fieldKey === 'is_active') return value
    ? '<span class="tag activo">Activo</span>'
    : '<span class="tag inactivo">Inactivo</span>';

  if (fieldKey === 'status') {
    const cls = value === 'completed' ? 'completed' : value === 'failed' ? 'failed' : 'pending';
    return `<span class="tag ${cls}">${escapeHtml(value)}</span>`;
  }
  if (fieldKey === 'type') return `<span class="tag info">${escapeHtml(value)}</span>`;
  if (fieldKey === 'amount' || fieldKey === 'price') return `<strong style="color:#fff;">${formatBs(value)}</strong>`;
  if (fieldKey === 'balance') return `<strong style="color:${Number(value) < 0 ? '#f87171' : '#4ade80'};">${formatBs(value)}</strong>`;
  if (fieldKey === 'created_at') return formatDate(value);
  if (fieldKey === 'id' || fieldKey === 'user_id') return `<span style="font-family:monospace;font-size:12px;color:#8a8aa0;">${escapeHtml(String(value).substring(0, 10))}...</span>`;
  if (fieldKey === 'logo_url' || fieldKey === 'avatar_url') return value ? '<span class="tag activo">Sí</span>' : '<span class="tag inactivo">No</span>';

  return escapeHtml(value);
}

// =============================================
// MODAL CRUD
// =============================================
function openModal(tableKey, row) {
  const schema = SCHEMA[tableKey];
  editingId = row ? row[schema.pk] : null;
  currentTableKey = tableKey;

  modalTitle.innerHTML = row
    ? `<i class="fas fa-pen"></i> Editar ${schema.singular}`
    : `<i class="fas fa-plus"></i> Nuevo ${schema.singular}`;

  const fields = schema.columns.filter(c => !['created_at','updated_at'].includes(c.key));
  let html = '<div class="fields-grid">';

  fields.forEach(col => {
    const val = row ? row[col.key] : '';
    const full = col.full || col.type === 'textarea' ? ' field-full' : '';
    if (col.type === 'readonly') return;

    if (col.type === 'textarea') {
      html += `<div class="field${full}"><label>${col.label}</label><textarea data-key="${col.key}" ${col.required ? 'required' : ''}>${escapeHtml(val ?? '')}</textarea></div>`;
    } else if (col.type === 'select') {
      html += `<div class="field${full}"><label>${col.label}</label>
        <select data-key="${col.key}">
          <option value="">— Seleccionar —</option>
          ${col.options.map(o => `<option value="${o}" ${val === o ? 'selected' : ''}>${o}</option>`).join('')}
        </select></div>`;
    } else if (col.type === 'select-fk') {
      const items = cache[col.fk] || [];
      html += `<div class="field${full}"><label>${col.label}</label>
        <select data-key="${col.key}" ${col.required ? 'required' : ''}>
          <option value="">— Seleccionar —</option>
          ${items.map(o => `<option value="${o.id}" ${val === o.id ? 'selected' : ''}>${escapeHtml(o.name)}</option>`).join('')}
        </select></div>`;
    } else if (col.type === 'boolean') {
      html += `<div class="field field-checkbox${full}"><input type="checkbox" data-key="${col.key}" id="chk_${col.key}" ${val ? 'checked' : ''}><label for="chk_${col.key}" style="text-transform:none;">${col.label}</label></div>`;
    } else {
      const inputType = col.type === 'number' ? 'number' : col.type === 'email' ? 'email' : col.type === 'date' ? 'date' : 'text';
      const step = col.step ? `step="${col.step}"` : '';
      html += `<div class="field${full}"><label>${col.label}</label>
        <input type="${inputType}" data-key="${col.key}" value="${escapeHtml(val ?? '')}" ${col.required ? 'required' : ''} ${step}>
      </div>`;
    }
  });
  html += '</div>';

  modalBody.innerHTML = html;
  modalOverlay.classList.add('show');
}

function closeModal() {
  modalOverlay.classList.remove('show');
  modalBody.innerHTML = '';
  editingId = null;
  currentTableKey = null;
}

modalClose.onclick = closeModal;
modalCancel.onclick = closeModal;
modalOverlay.onclick = (e) => { if (e.target === modalOverlay) closeModal(); };

// =============================================
// GUARDAR
// =============================================
modalSave.onclick = async () => {
  if (!currentTableKey) return;
  const schema = SCHEMA[currentTableKey];
  const payload = {};
  let valid = true;

  modalBody.querySelectorAll('[data-key]').forEach(el => {
    const key = el.dataset.key;
    const col = schema.columns.find(c => c.key === key);
    if (!col) return;
    if (col.type === 'readonly') return;

    let val;
    if (col.type === 'boolean') val = el.checked;
    else if (col.type === 'number') {
      val = el.value === '' ? null : Number(el.value);
      if (val !== null && isNaN(val)) val = null;
    } else val = el.value === '' ? null : el.value;

    if (col.required && (val === null || val === '')) {
      toast(`El campo "${col.label}" es obligatorio`, 'error');
      valid = false;
    }
    payload[key] = val;
  });

  if (!valid) return;

  try {
    modalSave.disabled = true;
    modalSave.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Guardando...';

    if (editingId !== null) {
      const { error } = await db.from(schema.table).update(payload).eq(schema.pk, editingId);
      if (error) throw error;
      toast('Registro actualizado', 'success');
    } else {
      const { error } = await db.from(schema.table).insert([payload]);
      if (error) throw error;
      toast('Registro creado', 'success');
    }
    const table = currentTableKey;
    closeModal();
    await loadAllData();
    renderTable(table);
  } catch (err) {
    console.error(err);
    toast(err.message, 'error');
  } finally {
    modalSave.disabled = false;
    modalSave.innerHTML = '<i class="fas fa-save"></i> Guardar';
  }
};

// =============================================
// ELIMINAR
// =============================================
async function deleteRecord(tableKey, id) {
  const schema = SCHEMA[tableKey];
  if (!confirm(`¿Eliminar registro de ${schema.label}?`)) return;
  try {
    const { error } = await db.from(schema.table).delete().eq(schema.pk, id);
    if (error) throw error;
    toast('Registro eliminado', 'success');
    await loadAllData();
    renderTable(tableKey);
  } catch (err) {
    console.error(err);
    toast(err.message, 'error');
  }
}

async function clearUserTransactionHistory(userId) {
  if (!confirm('¿Borrar todas las transacciones de este usuario y conservar su saldo actual?')) return;

  try {
    const balances = await calculateUserBalances();
    const previousBalance = Number(balances[userId] || 0);
    const { error: deleteError } = await db.from('transactions').delete().eq('user_id', userId);
    if (deleteError) throw deleteError;

    if (previousBalance !== 0) {
      const { error: adjustmentError } = await db.from('transactions').insert([{
        user_id: userId,
        type: previousBalance > 0 ? 'deposit' : 'withdrawal',
        amount: Math.abs(previousBalance),
        status: 'completed',
        description: 'Ajuste de balance tras borrar historial',
      }]);
      if (adjustmentError) throw adjustmentError;
    }

    toast('Historial eliminado y saldo conservado', 'success');
    await loadAllData();
    renderTable('users');
  } catch (err) {
    console.error(err);
    toast(err.message, 'error');
  }
}

// =============================================
// TRANSFERIR
// =============================================
function renderTransfer() {
  content.innerHTML = `
    <div class="page-header">
      <h2><i class="fas fa-paper-plane"></i> Transferir Fondos</h2>
    </div>
    <div class="panel">
      <div class="panel-header">
        <div class="panel-title"><i class="fas fa-arrow-right-arrow-left"></i> Nueva transferencia</div>
      </div>
      <div class="panel-body">
        <form id="transferForm" class="fields-grid" onsubmit="processTransfer(event)">
          <div class="field field-full">
            <label>Usuario Destino</label>
            <select data-key="userId" id="transferUserId" required>
              <option value="">— Seleccionar usuario —</option>
              ${cache.users.map(u => `<option value="${u.id}">${escapeHtml(u.full_name || u.email || u.id.substring(0,8))}</option>`).join('')}
            </select>
          </div>
          <div class="field">
            <label>Monto (Bs)</label>
            <input type="number" step="0.01" id="transferAmount" required>
          </div>
          <div class="field">
            <label>Tipo de Transferencia</label>
            <select id="transferType">
              <option value="deposit">Depósito</option>
              <option value="recharge">Recarga</option>
              <option value="transfer">Transferencia</option>
            </select>
          </div>
          <div class="field field-full">
            <label>Descripción</label>
            <input type="text" id="transferDescription" placeholder="Motivo de la transferencia">
          </div>
          <div class="field field-full" style="flex-direction:row;justify-content:flex-end;gap:10px;">
            <button type="submit" class="btn btn-success"><i class="fas fa-paper-plane"></i> Realizar Transferencia</button>
          </div>
        </form>
      </div>
    </div>
  `;
}

async function processTransfer(event) {
  event.preventDefault();
  const userId = document.getElementById('transferUserId').value;
  const amount = parseFloat(document.getElementById('transferAmount').value);
  const description = document.getElementById('transferDescription').value;
  const type = document.getElementById('transferType').value;

  if (!userId || !amount || amount <= 0) {
    toast('Complete todos los campos correctamente', 'error');
    return;
  }

  try {
    const { error } = await db.from('transactions').insert([{
      user_id: userId,
      amount: amount,
      type: type,
      status: 'completed',
      description: description || `Transferencia administrativa de ${formatBs(amount)}`,
      metadata: { admin_transfer: true, timestamp: new Date().toISOString() }
    }]);
    if (error) throw error;

    toast(`Transferencia de ${formatBs(amount)} realizada`, 'success');
    await loadAllData();
    document.getElementById('transferForm').reset();
  } catch (error) {
    toast('Error: ' + error.message, 'error');
  }
}

// =============================================
// INIT
// =============================================
(async function init() {
  try {
    const { error } = await db.from('user_profiles').select('id', { count: 'exact', head: true });
    if (error) throw error;
    await loadAllData();
    renderDashboard();
  } catch (err) {
    console.error(err);
    $('#connStatus').innerHTML = '<i class="fas fa-circle" style="color:#f87171;font-size:8px;"></i>Error de conexión';
    content.innerHTML = `<div class="empty-state" style="color:#f87171;">
      <i class="fas fa-exclamation-circle" style="font-size:36px;display:block;margin-bottom:12px;"></i>
      Error al conectar con Supabase: ${escapeHtml(err.message)}
    </div>`;
  }
})();
</script>
